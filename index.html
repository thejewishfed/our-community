of Community Firsthand", "by": "Terry Feldbaum, Annual Campaign Co-Chair", "page": 4}, {"title": "New Chapter, A Familiar Community", "by": "Monroe Lemay-Emerick, Director of Programming", "page": 5}, {"title": "Holocaust Education Is Needed Now More Than Ever", "by": "Dennis Kaplan", "page": 6}, {"title": "Reflections From My Partnership Trip to Israel", "by": "Kim Cossman, Partnership2Gether", "page": 8}, {"title": "Hanukkah at the Morris and more events", "by": "PJam, Community Chanukah Celebration, Israel After the Election", "page": 10}, {"title": "Legacy, Medicare and a Natalie Klein retrospective", "by": "Michiana Jewish Historical Society, Jewish Family Services, Fine Arts", "page": 11}, {"title": "The Incidents We Don’t See", "by": "Emily Benedix, Executive Director", "page": 12}, {"title": "Thank You, Barbara Lerman", "by": "Bob Feferman", "page": 13}, {"title": "PJam Brings Family Fun to Federation", "by": "Hanukkah kits and Peekaboo Hebrew", "page": 14}, {"title": "Help Us Strengthen Our Caring Connections", "by": "Rabbi Fred Nebel, Jewish Family Services", "page": 15}, {"title": "The Seixas Family in South Bend", "by": "Michael Brown, Indiana Jewish Historical Society", "page": 16}, {"title": "A Fresh Look for Our Community", "by": "Steve Lotter, Editor", "page": 17}, {"title": "Muffins Even a Pumpkin Pie Skeptic Can Love", "by": "Community Table with Deena Abraham", "page": 18}, {"title": "Staff, board, tributes and birthdays", "by": null, "page": 19}, {"title": "Jewish Business Expo", "by": "Reserve a table by December 31", "page": 20}]}, {"slug": "2026-09-sep-oct", "name": "Our Community Newsletter", "title": "September–October 2026", "hebrew": "Elul–Tishrei–Cheshvan 5787", "pages": ["issues/2026-09-sep-oct/01.webp", "issues/2026-09-sep-oct/02.webp", "issues/2026-09-sep-oct/03.webp", "issues/2026-09-sep-oct/04.webp", "issues/2026-09-sep-oct/05.webp", "issues/2026-09-sep-oct/06.webp", "issues/2026-09-sep-oct/07.webp", "issues/2026-09-sep-oct/08.webp", "issues/2026-09-sep-oct/09.webp", "issues/2026-09-sep-oct/10.webp", "issues/2026-09-sep-oct/11.webp", "issues/2026-09-sep-oct/12.webp", "issues/2026-09-sep-oct/13.webp", "issues/2026-09-sep-oct/14.webp", "issues/2026-09-sep-oct/15.webp", "issues/2026-09-sep-oct/16.webp", "issues/2026-09-sep-oct/17.webp", "issues/2026-09-sep-oct/18.webp", "issues/2026-09-sep-oct/19.webp", "issues/2026-09-sep-oct/20.webp", "issues/2026-09-sep-oct/21.webp", "issues/2026-09-sep-oct/22.webp", "issues/2026-09-sep-oct/23.webp", "issues/2026-09-sep-oct/24.webp"], "text": ["Newsletter OUR COMMUNITY September-October 2026 Elul-Tishrei-Cheshvan 5787 Our Favorite Israeli Cowboy In this issue, we say lehitraot (“see you later”) to our outgoing Israeli emissary, Omer Karavani (pictured here in the mountains of Montana). Plus, read one of the earliest issues of Our Community from 1946 on page 19. A PUBLICATION OF THE", "Why I Give A Message from Executive Director Emily Benedix I am always grateful to the members who continue to support our Jewish Federation. It may seem like lip service, but it’s been true since the first day I set foot on our campus. Many of you have been supporters longer than I’ve been involved, and your commitment continues to humble me in my work. Others may be new (or recently returned) to the community and are giving for the first or second time. Regardless of how many times you have given, you have ensured that our community can impact Jewish lives, locally and globally, in the best ways possible. This includes, but is by no means limited to, 55 individual programming opportunities in the last year alone. And that number does not include the countless interactions that happen through our board and committee meetings, JFS connections, the use of our building by community members and organizations, or the many personal relationships that begin within our walls. More than 40 young adults engaged in Young Adult programs, including nine who participated in our inaugural Jewish Engagement Fellowship program. This program brought future leaders together with seasoned members of our community to discuss issues relating to Jewish identity and community. Seventy community members and their families received assistance from JFS in the form of Virtual Food Pantry distributions, rides to medical appointments, home visits, and weekly check-ins. At least 80 students in the greater South Bend-Mishawaka community were engaged by our Holocaust Education Speakers Bureau, and we helped underwrite a trip for FEAST students at Sinai Synagogue to visit the Illinois Holocaust Museum’s Experience360 in downtown Chicago. One hundred seventy-five individuals, Jewish and non-Jewish, attended our Yom HaShoah program and premiere screening of The Magic Lantern at DeBartolo Performing Arts Center’s Browning Cinema. Another 80 joined us less than a week later to hear the personal story of community member Sherry Moses, of blessed memory. 2 | Our Community News Our local Lions of Judah gathered at the home of Lynda Simon. One hundred sixteen attendees enjoyed our Taste of Israel program for Yom Ha’Atzmaut, following a week of volunteer and cross-community participation to prepare the meal served by our Partnership2Gether Chef’s delegation. for me the important role our organization plays. As my responsibilities and the challenges that accompany them have increased, so has my understanding and appreciation of the work your support allows us to do every day. Opportunities to engage with art, music, and various speakers brought unique perspectives on Israel to our community, and Omer Karavani, our Israeli shaliach, shared his My Israeli Story presentation with organizations throughout the community, including at two other Federations per their request. I often think of the unique impact Federation has had on Jewish lives. We applied for and administered the LiveSecure grant offered by the Jewish Federations of North America, making $49,000 available to our congregations for security needs. We also worked with Safe Indiana and Secure Community Network to offer a community security training with five of our interfaith partners. Thirty-five individual campers took part in our Camp Ideal season, including two weeks of joint programming with our newest partner, Camp Invention. We worked with eight Jewish community organizations locally, six broader community organizations, and seven national and state partners to provide programming and support. But the numbers only tell half the story. One thing I have learned about Jewish nonprofits is that there are two types of metrics: the numbers of attendees, donations, and allocations, and the equally significant mental, emotional, and personal impact of each interaction. Every year that I have worked within the Jewish Federation network has reaffirmed Like the member who relied on our food pantry for three years while facing high medical bills. Because of your support, she didn’t have to choose between her medications and meals while struggling with chronic illness. Or the Camp Ideal camper who shared just how meaningful Camp had become during a particularly difficult time in her life, giving her a place of connection, belonging, and joy. And the senior whose excitement over inviting her friends to the Film Festival each year led to an annual outing for a local assisted living community. Because of your support, we are here for the retired professor who took such joy in calling our office every week with recommendations for new things to read, and the widower for whom we created tasks to guarantee he had a chance to volunteer and engage in a social environment. I think of the excitement of one of our community members when I shared that we would help her visit Israel for the first time through our Partnership2Gether program. I close my eyes and can visualize a picture of a Penn student taking a selfie with a Holocaust survivor.", "And these don’t even begin to touch the many stories I’ve heard secondhand: the resettlement of Soviet Jews in our community, the successful outreach developed through decades of summer camp, supporting social services in our Partnership2Gether region, the advocacy provided by our Community Relations Committee, or the hundreds of friendships, relationships, and opportunities supported by your gifts. With all of these memories, I’m keenly aware of the legacy for which we are responsible: the continuation of a sustainable Jewish community in Michiana, the large shoes we have to fill following the leadership that preceded us, and the responsibility to build on the mission and values that have provided support and strength for Jewish lives locally, nationally, and globally. In the coming year, we face these challenges with excitement. We are conducting a Jewish Family Services survey, to be followed by group discussions, to ensure we are providing the services our community needs. Last month, after a successful Board retreat where we shared how Federation values shape our individual goals, 10 teens and their parents joined us to discuss the relaunch of a BBYO partnership for our community. On November 5, we’ll have a Campaign event featuring the Jewish a cappella group Listen Up! And this is just the start as our team and committees begin working to ensure that next year is as meaningful and impactful as the legacy we carry. As we begin our 2027 Annual Campaign year, I’m sharing these thoughts with you not just as the Executive Director, but also as a community member and donor. I am proud to be a contributor to our Annual Campaign as a member of our Jewish community and invite you to join me in being part of this Federation’s success. More importantly, I invite you to join me as we embrace our Jewish community and help better the Jewish lives of our friends and neighbors. Emily Benedix Executive Director (574) 233-1164 x1802 Emily@TheJewishFed.org We’re PJammin’! Hi! I’m Nurit, your PJ Library Program Associate, and I’m excited to introduce PJam, a new Federation initiative for PJ Library families with children from ages 0-8. PJam will bring young families together for fun activities, Jewish stories, holiday celebrations, and opportunities to meet other families and build lasting friendships. Our very first PJam celebrating Sukkot is Wednesday, September 30 at 5:30 PM. Register to attend Pizza in the Hut at TheJewishFed.org/PJam. Cost to attend is $5/family (includes pizza, drinks, & snacks). Children over age 8 are invited to join the fun and help with our activities as PJam Stars—our special PJam helpers! Please contact me with questions about PJam, becoming a PJam Star, or enrolling in PJ Library for children through age 12. Nurit Levy-Beiersdorf Administrative & Program Associate 574-233-1164 x1820 Nurit@TheJewishFed.org Our Community News | 3", "Thousands of Miles Away from Home, to Another Home Three years is a strange amount of time. On paper, it is just a number. Three years of calendars, meetings, programs, and events. But when I look back, I don’t see three years. I see thousands of moments. I see the people who welcomed me when I first arrived. I see the kids who were strangers to me and eventually became familiar faces. I see celebrations, Shabbat dinners, camps, holidays, Israel events, educational programs, difficult conversations, stressful days, and the moments when everything somehow came together at the very last second, most of the time because of the Federation’s amazing team. I came here as an Israeli emissary, but somewhere along the way, this stopped feeling like just a job. I think everything changed after October 7. At that point, I had been here for less than three weeks. I remember the conversation as clear as day. Moshe, may his memory be a blessing, called me into the office and emphasized that, because of what had happened, the Federation understood if I needed time to reflect or take time off. There was no pressure. It was understandable. But I thought to myself: This is the most devastating event to happen to the Jewish people since the Holocaust. How can I, as an emissary, as an Israeli, as a Jewish person, sit aside and take time to myself when I know people will have questions? People will want to ask about the conflict. I knew I had to be there to give direct, strong answers. I told myself, “They need me to answer those questions. I need to be here to provide context. I need to work harder. I need to be here. The Jewish community here needs me.” What an arrogant kid. Little did I know that I needed them more. Because in the beginning, the questions were never about the war. They were always: Omer, how is your family doing? Does anyone need help? How are you feeling? 4 | Our Community News Of course, people had questions about the situation. But what was more important to them was how they could help me. The hug I received from this community was absolute. The support and unconditional love, the feeling and sense of belonging I experienced from the very beginning, are why I consider South Bend to be my home. And you know what? When the questions did arrive, about the conflict, Israel, Jewish life, and other difficult subjects, I came to love having those conversations. In the beginning, I was terrified of them. Not because I didn’t know the answers, but because of who I was talking to. I mean, how could I, a 23-year-old kid, have these serious conversations with people here? Professors. Doctors. Lawyers. People with years of experience and knowledge in these fields. Why would they care about my opinion? that shaped me as a person. Sometimes that meant standing in front of a classroom and talking about Israel. Sometimes it meant answering questions. Sometimes it meant celebrating together. And sometimes it simply meant being an Israeli in the room, someone people could talk to, ask questions, laugh with, or disagree with. As some of you know, I want to work in diplomacy, and South Bend taught me the biggest lesson about diplomacy and about being an emissary: It was never about having all the answers to all the questions. It is about building relationships. Instead of people looking at Israel or the Jewish people as a collective, an agenda, an idea, something far away, or through assumptions and prejudices, it’s about making sure they see kindness and humor. A shoulder to lay a head on. An ear to listen. An eye that sees them. But they did. It’s about making sure they see a person. They wanted to listen to me. And that encouraged me to learn more and research more. This community is filled with some of the most brilliant people I have ever met, and I don’t just mean academically. In every way that one person can learn from another, this community made me feel welcome to share my thoughts and encouraged me to keep learning. And a nice one. For three years, I had the privilege of representing Israel and sharing something incredibly personal with other people. I wasn’t simply teaching facts about a country on a map. I was sharing pieces of my home, my childhood, my family, my experiences, my memories, and the places It is about building relationships. And the relationships are what I will miss the most. Over these three years, I met so many people who changed me without necessarily realizing it. Teachers who trusted me. Parents who welcomed me. Colleagues who became friends. Students who reminded me why I was doing what I was doing. People who challenged my thinking, a lot of the time from very unexpected places. People who gave me a place to belong when I was thousands of miles away from home.", "I came here to give something to this community. I didn’t expect to receive so much in return. During these three years, I was fortunate enough to do much more than one job. I taught. I wrote. I organized. I spoke. I worked with children. I helped create camps and programs. I participated in conferences and community events. I celebrated holidays with people. And through all of it, I learned things that no job could ever have taught me. I learned that building a relationship isn’t about being the loudest person in the room. Sometimes it is about listening. I learned that people remember how you made them feel far more than they remember what you said. Most importantly, I learned that home isn’t always a specific place. Sometimes it’s the people who know you. That is why leaving is so difficult. I am not just leaving a position. I am leaving the feeling of knowing where I belong. But I don’t want my goodbye to be defined by sadness. I want it to be defined by gratitude. Thank you to everyone who trusted me. Thank you for three incredible years. Thank you to everyone who gave me an opportunity to learn from them. Thank you for letting me be part of your lives. Thank you to the people who welcomed me into their homes and their lives. And thank you for giving me a chapter that I know I will look back on for the rest of my life. Thank you to everyone who came to an event, listened to a presentation, participated in a program, asked a question, shared a meal, or simply stopped to say hello. And thank you to this community for allowing me to become part of it. I am leaving this job, but I am not leaving empty-handed. I am taking pieces of this community with me. And hopefully, somewhere along the way, I have left a little piece of myself here, too. Three years ago, I arrived as an Israeli emissary. Today, I leave knowing that I became something more: a friend, a teacher, a colleague, and, most importantly, a member of a community that I will always care about. In his presentation, we learned of the dangers that he and his family faced with constant rocket attacks from Hamas on his hometown of Ashkelon even before You can reach me on WhatsApp at 972-533400283. And for the last time, until we meet again: GO IRISH, GO HOOSIERS, AND GO SOUTH BEND! Omer Karavani Israeli Emissary (574) 233-1164 x1819 Israel@TheJewishFed.org At an Israel Solidarity event on October 11, Omer asked for our support. He said, “As I speak, people in Israel have put their differences aside for the sake of the country. We had the biggest call up of reserves since the country was established. 300,000 men and women answered the call to duty. Israelis of all ages are dedicating themselves to collect food, clothes, money, and other items for the soldiers and families in need.” Over the past three years, our community was blessed to have Omer Karavani as our Israeli shaliach (emissary). Given the fact that Israel was fighting a war for its survival on seven fronts, his presence here became very important. On behalf of all Federation staff members, it was our privilege to work with Omer during this time. During his time, Omer gave his My Israeli Story presentation both to the Jewish and non-Jewish community. This included presentations to non-Jewish audiences at Sunnyside Presbyterian Church, Elkhart Rotary, and the Forever Learning series. But I know that wherever I go next, a part of me will always remain here. Thank you. Thank You Omer Karavani As we all know, in addition to its struggle for survival against Iran and its proxies, Israel was also fighting a battle for public opinion here in America. Omer provided our community with the crucial missing context for understanding these challenges. Now I am beginning my academic journey at Reichman University in Israel, where I will study political science and international relations, fully in English and alongside people from countries around the world. I hope this is the next step in continuing to make Jewish life better around the world. the Iron Dome air defense system was deployed in 2011. Omer also created a new presentation titled, The Jews of the Muslim World. His family story gave our community important insights into Israeli society. Given the fact that his family came from Iraq and Yemen, we learned that more than half of the Jewish population of Israel today is comprised of Jews from the Muslim world. With the attack by Hamas on Israel on October 7, 2023, Omer’s presence here was crucial in helping us understand the reality facing Israelis. His first speech to our community was given just days after the attack. In addition to his work in advocacy for Israel, Omer took on a leading role in several other Federation projects. He helped to plan and coordinate the annual Purim Carnival and was a lead counselor in Camp Ideal. Through his many important contributions to our community, we can say that we were blessed to have an outstanding representative of Israel in these challenging times. Bob Feferman Community Contributor Our Community News | 5", "The Messenger & the Mission As Bob Feferman thoughtfully describes in his article, Omer Karavani gave our community three extraordinary years as our Israeli shaliach. Rather than repeat his many accomplishments, I want to reflect on what it meant to work beside him during his final year. Long before today’s brave new world of agentic AI made “agents” a technological buzzword, Jewish tradition had already given us a deeply human understanding of agency. A shaliach is someone entrusted to act on another’s behalf for a particular mission. He carries more than information; he carries something of the sender’s purpose and spirit. The Torah offers powerful examples of people entrusted with such missions. Eliezer acted on Avraham’s behalf when he journeyed to find a wife for Yitzhak. Moses was sent to lead the Israelites toward freedom. Each was entrusted not simply with words, but with a purpose that had to be carried faithfully. Omer’s mission was, of course, a deeply personal one. His title was Israeli emissary, but his deeper work was to make Israel a living, human presence in Michiana. Before his service as a combat soldier in the IDF, Omer chose to spend a year volunteering with children and older adults in underserved Jerusalem communities. Service was not something he discovered in South Bend; it was part of what he brought with him. his own experiences and family history to reveal the richness and diversity of Israeli society. At A Taste of Israel, our Yom HaZikaron and Yom HaAtzmaut program, he traded his camp hat for the poise and quiet gravitas of a seasoned interviewer. His poignant questions for the chef delegation opened a conversation about life in northern Israel after October 7th helping give them a voice and a path toward healing. Sarit told us it was the first time she had spoken publicly about her experience. Omer helped bring personal stories forward. He carried that same purpose into Holocaust-education programs at Penn High School and Holy Family School, where he served as an agent of awareness by presenting Eva’s Story—a social-media retelling based on a young Jewish girl’s real diary that local students use a personal entry point into Holocaust history. Together, we did more than place programs on a calendar. We created encounters that connected people across Michiana with Israel and the Jewish experience. For that, I am deeply grateful. As many of you may already have heard, Omer will not be the only person leaving the Federation this season. After a deeply meaningful year as Director of Programming and Community Relations, I have accepted another opportunity and will soon step down from my position. At a time when many Americans encountered Israel primarily through headlines, Omer offered something no news report could: a relationship. I came to the Federation because I shared the passion of Moshe Kruger, z”l, for Jewish communal service. Moshe was a visionary in the truest sense, and his vision helped me see this campus not simply as property, but as possibility: a beautiful, tree-lined Jewish oasis in the middle of South Bend, with a welcoming building, open fields, forest trails, and sports areas. I had the privilege of working with Omer during the final year of his service. At the Purim Carnival and our summer and winter Camp Ideal programs, Omer shined. He proudly led campers in Hatikvah, ran Maccabiah games, and became like an older brother to them. But when campers were in need of instruction, he could summon a commanding voice of a true leader. The Federation is a place where Jews of every denomination and background can come together. Over the past year, I was grateful to renew relationships with so many people I knew growing up at Sinai Synagogue and attending Hebrew School at Temple Beth-El, while also forming new friendships. Serving this community allowed me to know it again in a deeper and more meaningful way. His serious side was equally compelling. Through his presentations, Omer used I have also been privileged to work beside colleagues who care deeply about serving our Jewish community. They bring dedication and care not only to visible events, but also to the 6 | Our Community News quiet daily work that sustains Jewish life. A campus, however, becomes a community only when people fill it. Spend time here. Come to an event. Join a committee. Volunteer. Bring your ideas. If the program you need does not yet exist, help create it. The Federation is here for you because of you—and because those who came before us understood both the joy and the necessity of creating a shared home for Jewish life in America. Nonprofit organizations exist to make an impact. Here, you are not simply the audience for that impact. You are the impact. At our Friday-night tables, we sing Shalom Aleichem. We welcome the angelic messengers, ask for their blessing, and finally sing Tzeitchem l’shalom—go forth in peace. Many families repeat each stanza three times. For us, that repetition carries a personal resonance: once for each of Omer’s three years among us. For the Israel you brought closer, todah. For the Jewish joy you gave our children, todah. For your heart, strength, and service, todah. We send Omer back to Israel with our blessing and hope that his path will someday bring him back to South Bend. Wherever he goes, I am confident he will remain a shaliach in the broadest sense—an agent of connection, service, and responsibility for Am Yisrael. Omer’s departure leaves a real void. The Federation will now turn its attention to other forms of Israeli programming that can help fill that void and keep our connection to Israel direct, personal, and human. No program can replace Omer himself, but this community can carry the mission forward. As I begin a new path as well, I leave with tremendous gratitude for the year we shared and confidence in what remains possible here. To Omer, and from me to you: lehitraot. Jordan Price Outgoing Director of Programming & Community Relations", "A Season of Connection and Community From summer traditions to new opportunities for learning, celebration, and engagement this fall. We’ve had a busy few months here at the Federation, capped off by an incredible turnout for our annual Community Picnic & Concert on August 30. It was a wonderful opportunity for our community to come together and say lehitraot, or “see you later,” to our friend and colleague Omer Karavani. We were also thrilled to welcome Danny Lerman, Dror Baitel, and their many talented friends, who provided the perfect soundtrack to these final days of summer. I love that this event has become an annual tradition, something we can look forward to each year as we say goodbye to summer and reconnect with old friends while welcoming new ones. This is especially meaningful for those who have recently moved to our area and are looking to find their place in our Jewish community. Thank you to everyone who joined us and helped make this year’s gathering so special! As we turn toward fall and the start of a new Jewish year, we look forward to offering even more opportunities to connect, learn, celebrate, and build community together. I’m especially pleased to share a new, or perhaps renewed, collaboration between our Jewish Federation and BBYO. Thanks to the enthusiasm and leadership of Kayla New, with support from her mom, Megan, the seeds have been planted for a new chapter of BBYO right here in South Bend. You can read more about this exciting development on page 10. Forever Learning is also back at the Federation beginning Thursday, October 1 at 11:00 AM, for a four-week series, Perspectives on the Holocaust. The series will feature presentations from members of our Holocaust Education Speakers Bureau: Sid Shroyer, Terry Tulchinsky, Deena Abraham, and Bob Feferman. Register at TheJewishFed.org/FLI. Finally, I’m excited to announce that we will once again kick off our 2027 Annual Campaign with a celebration of Jewish joy and the power of music. On Thursday, November 5 at 7:00 PM, we’ll welcome the Jewish vocal group Listen Up! for an evening of song, community, and connection. Tickets are $18 per person, with additional info available at TheJewishFed.org/Kickoff. On a personal note, it is with tremendous gratitude that I step into my new role as Senior Director of Development & Engagement. I look forward to connecting with many of you in the months ahead, hearing what matters most to you, and finding new ways to deepen your connection to our shared Jewish community. Whether you’ve been part of our Federation community for decades or are just beginning to find your place here, please know there is always a seat for you at our table. Steve Lotter Senior Director of Development & Engagement (574) 233-1164 x1805 Steve@TheJewishFed.org Our Community News | 7", "Our 2026 Annual Campaign Donors Deena & Dovid Abraham Iga & Roni Aizigov Sheri Alpert Sarah Anne Anes Mary Sue & Terry Austin Donna Barton Ayres Amy & Max Baim David & Billie Bankoff Sandy Barton Lion of Judah Endowment Marzy & Joseph Bauer Frank Becker Nurit & Ian Beiersdorf Scott & Sharon Beisel Emily Benedix Shirley Berebitsky Daniel Berebitsky Katie Berlent & Steven Richter Howard Berman Janet Berman z”l Lion of Judah Endowment Susan & Gary Bernstein Catherine & Steven Blum Steven & Maureen Bluth Ma  students to a public high school with more than 1,000 students, where only a handful were Jewish. BBYO gave me the opportunity to regularly spend time with other Jewish teens from my community, but also to meet Jewish teens from across the country. I even met Dan at LTI (Leadership Training Institute) a regional KIO (Kentucky, Indiana, Ohio) convention which was held at GUCI! It seems like it’s B’Sheret for our daughter to be the one to restart it. My last BBYO experience was a trip to Israel during my senior year of high school, and it had a huge impact on my life. It helped shape my connection to Judaism, Israel, and the Jewish community in ways that have stayed with me ever since. There aren’t many things better than watching your child get excited about something that you know could have a lasting impact on their life. Kayla is excited about building relationships with local Jewish teens, attending regional conventions where she’ll meet Jewish teens from Indiana, Ohio, and Kentucky, 10 | Our Community News Top: South Bend area teens pose together at a recent BBYO gathering. Bottom: Jewish teens from the Kentucky-Indiana-Ohio region at King’s Island. and—hopefully one day—taking a BBYO trip to Israel. BBYO is a global movement of Jewish teens building a better world. BBYO inspires Jewish teens to find their people, shape their purpose, and lead their communities, supported by families, alumni, and partners who believe in the power of Jewish youth. We are so excited to be restarting a South Bend BBYO chapter! If you know a Jewish teen in 8th through 12th grade who is interested in learning more, please encourage them to reach out to us. One thing that is especially important to Kayla is that everyone feels welcome. What makes BBYO so special is that it brings together people who might never have met otherwise. It is a place where teens can feel welcomed, safe, and included—and where no one should ever feel like an outsider. We had a wonderful turnout at our initial callout meeting a couple of weeks ago, and we’re excited to continue building this new chapter together. We’ll be getting together for Sukkot on October 1st, at 6 p.m., at the Jewish Federation and we can’t wait to see everyone there! More information at TheJewishFed.org/BBYO. We are so excited to bring BBYO back to South Bend and, hopefully, create the same kind of meaningful memories and connections for today’s Jewish teens that BBYO gave me all those years ago. And yes, I realize that technically makes me the advisor now. I’m choosing to focus on the fact that I’m young at heart rather than doing the math on how long ago I was in BBYO. Megan New BBYO South Bend Parent Advisor", "A Sweet New Year Begins with an Open Hand A Message from Rabbi Fred Nebel, Director of Jewish Family Services (originally published 8/11/2026) It’s hard to believe that Rosh Hashanah is around the corner. Of course, with the approach of Rosh Hashanah, it also is time for our semiannual fundraiser for the Jewish Family Services Virtual Food Pantry program. Our goal is $6,000. G-d willing, this will supply the pantry through Pesach. Rosh Hashanah is a time for reflecting on how the previous year went and looking to improve one’s behavior. It is a time, the Rabbis tell us, that Hashem decides what will take place in the coming year. Will one receive a pay raise, lose a job, be healthy or sick, rich, or poor, live or die, etc. And we all from know the refrain of the hauntingly beautiful prayer Unetanah Tokef that Teshuvah (repentance), Prayer, and Tzedakah will avert the decree. The Rabbis were trying to impart the important principle that these are three necessary steps towards influencing Heaven to bless us. The third step of tzedakah is crucial to understand. How should we accomplish this worthy goal? The Torah lays out the mitzvah (commandment) of tzedakah in the following verses: Deuteronomy 15:7–8: been considered good, but now, sadly, it’s bordering on poverty, unless you live by yourself. If, however, there is a needy person among you, one of your kindred in any of your settlements in the land that Hashem, your G-d is giving you, do not harden your heart and shut your hand against your needy kindred. Rather, you must open your hand and lend whatever is sufficient to meet the need. The mission of the Pantry program is to supplement the client’s income and to enable them to buy food that they need. Your donation will help us help others so that they don’t have to make a decision to either pay rent or buy food. They will be able to do both things. The Rabbis explain that “needy kindred” refers to someone who has temporarily hit hard times. They explain the phrase “meet the need” to mean that “we must even supply a servant to run ahead of the person supplying the help and proclaim that he is on the way.” But they continue to explain that if the needy person is already soliciting funds from the general fund, then individuals need not supply his every need, as he has become accustomed to accepting charitable funds. Recently, I went shopping for some basics and was shocked by the prices. I understand that there are economic factors that have driven up prices, but it makes it very difficult to buy food. A small plastic bag of groceries that include neither meat nor fish cost me over $30. It is no surprise that people are finding it hard to make ends meet. I spoke with a person who was working full-time, earning $19 per hour, asking for help with rent. She has seven children and told me her food bill ranges between $800–$1000 monthly. A few years ago, her salary would have Please donate what you can by visiting TheJewishFed.org/Appeal and encourage others to follow suit. Every donation, no matter the size, will get us closer to our goal. In the merit of your donation, May Hashem grant you a healthy, sweet, and prosperous Rosh Hashanah. May you and your entire family be sealed in the Book of Life. UPDATE (as of 9/8/2026) Baruch Hashem, I am excited to  "Remembering October 7 Through the Story of RITA Federation will gather October 6 for a community commemoration, documentary screening and conversation with Nova survivor Rita Yedid On Tuesday, October 6 at 7:00 PM, the Jewish Federation of St. Joseph Valley invites our community to come together to remember the victims of the October 7, 2023 attacks in Israel and to hear an extraordinary story of survival, healing and hope. The evening will include a short community-led commemoration ceremony followed by a screening of RITA, a new documentary centered on Rita Yedid, who survived the Hamas attack on the Nova Music Festival near Kibbutz Re’im. Following the film, Rita will join us live from Israel via Zoom for a Q&A and conversation with our community. October 7, Rita says, divided her life into two chapters: “before and after October 7.” Survival was only the beginning. In the weeks and months that followed, Rita struggled with grief, fear, anger and trauma. Gradually, sharing her experience became part of her own healing. What began as a way to process what had happened grew into a new sense of purpose. Today, Rita travels and speaks to communities about trauma and recovery, using her own experience to encourage empathy, connection and hope. That journey is at the heart of RITA. Directed by Israeli filmmakers Asaf Sudry and Tali Shemesh, the documentary combines intimate footage captured during the months following October 7 with Rita’s reflections today. The film follows not only the story of how she survived, but what happened afterward: the difficult work of rebuilding a life after experiencing unimaginable violence. One of the film’s most powerful threads follows Rita as she returns to the Nova site at Re’im. As reported by Jewish News Syndicate (JNS) following the film’s premiere, Rita first went back six months after the attack, unsure what returning to the place where she nearly died would do to her. The site has since become a place of remembrance for those murdered there, and Rita sees telling her story as another way of ensuring that the people who lost their lives are not forgotten. 14 | Our Community News The film also captures unexpected parts of Rita’s recovery, including her decision to dance again. According to JNS, music and dancing had become intertwined with the trauma of Nova, and Rita initially believed she might never be able to return to them. Eventually, dancing became part of her healing, helping her reconnect with something that had brought her joy before October 7. Rita now describes herself as a wife, mother, survivor, speaker and advocate for healing and hope. Through sharing her story, she says she has discovered that healing does not mean forgetting or leaving pain behind. Rather, it can mean learning to carry sorrow while continuing to find meaning, connection and purpose. That message makes RITA particularly meaningful as our community marks three years since October 7. Our October 6 gathering will begin by creating space to remember, to honor the lives taken at Nova and in the surrounding kibbutzim and communities, and to acknowledge the profound impact October 7 continues to have on Israelis and Jewish communities around the world. But remembrance is also about the lives that continue. Through RITA, we will meet one of those lives up close: a woman who went to Nova to dance, survived a day that changed her forever, and has chosen to use her voice to make sure the story of what happened, and the people who were lost, is not forgotten. We hope you will join us at the Jewish Federation of St. Joseph Valley on Tuesday, October 6 at 7:00 PM to remember together, experience Rita’s remarkable story, and have the rare opportunity to hear directly from her following the film. Register at TheJewishFed.org/Rita.", "The Colorful World of Natalie Klein: An Artist Retrospective Sunday, October 18 | 2:00–4:00 PM at theJewish Federation of St. Joseph Valley Special guest Laura Klein Tompkins, daughter of Natalie Klein Bold color. Expressive movement. A lifelong fascination with the natural world. This fall, the Jewish Federation’s Fine Arts Committee invites you to experience the work of longtime South Bend artist and educator Natalie Klein through a special retrospective celebrating her distinctive artistic vision. Join us on Sunday, October 18 from 2:00–4:00 PM for the opening of The Colorful World of Natalie Klein: An Artist Retrospective. Bringing together works from across Klein’s artistic career, the exhibition offers an opportunity to explore the subjects, colors, and ideas that captured her imagination over the years. Making the afternoon especially meaningful will be the presence of Natalie’s daughter, Laura Klein Tompkins, who will join us as our special guest as we celebrate her mother’s art and legacy. Klein’s connection to the South Bend community spans more than half a century. Originally from the Chicago area, she earned a Bachelor of Fine Arts degree from Washington University in St. Louis, studied art history at the University of Florence in Italy, and continued her study of painting at the University of Notre Dame. Alongside her own artistic career, she spent many years teaching visual art in the South Bend Community School Corporation. Throughout her career, Klein exhibited widely, including at the Art Institute of Chicago’s Sales and Rental Gallery, Chicago Botanic Gardens, South Bend Regional Museum of Art, Midwest Museum of Art, and galleries throughout the region. But it is the work itself that tells Natalie’s story most vividly. Landscapes and forms found in nature remained constant themes, transformed through an Expressionistic approach rooted in gesture and feeling. Skies became a particular fascination, with changing cloud formations serving as a metaphor for change itself. At other times, inspiration came from rocks and stones, weathered surfaces, and rusted and corroded metal. Across these subjects, light, movement, color, and texture became the vocabulary through which Klein recorded her observations of the world around her. Her palette could be exuberant—azure blues, cadmium reds and yellows, punctuated by sudden strokes of black. The resulting paintings possess a sense of movement and discovery, inviting the viewer to find something unexpected within their layers of color and texture. Natalie’s relationship with the Jewish Federation’s Fine Arts program also has a rich history of its own. As a longtime member of the Federation’s Fine Arts Committee, alongside Marsha Brook, Diane Sarnat, and Lynda Simon, Natalie has helped organize dozens of exhibitions in the Federation’s Bankoff Atrium Gallery over the years, sharing her love of art not only through her own work but by helping bring the work of other artists to our community. Natalie has also exhibited her own work at the Federation. More than two decades ago, the Federation hosted Earth, Wind and Fire: Paintings by Natalie Klein, an exhibition exploring her fascination with land, sky, rusty surfaces, aging, and change. Now, The Colorful World of Natalie Klein brings her work back to the Federation in a retrospective that celebrates not simply individual paintings, but the creative journey of an artist who has been part of the fabric of our community for decades. Please join us Sunday, October 18 from 2:00–4:00 PM as we open this special exhibition, welcome Laura Klein Tompkins, and celebrate the colorful world—and lasting artistic legacy—of Natalie Klein. Our Community News | 15", "A Special Treat for a Sweet New Year... From Our Community Table to Yours! 16 | Our Community News Jody Frei Chocolate-Dipped Caramel Apples Creates 6 gift-worthy treats Ingredients Useful Supplies Parchment paper; mini wooden sticks and a small mallet; two 4-cup glass measures; a 12 oz squeeze bottle; produce wash; optionalcellophane bags, ribbon, gift tags, and a drilled drying board. 6 round, unbruised Granny Smith apples with flat bottoms 3 Ib ready-made caramel oom and the study hall: meeting my wife, Rebekka, around a bustling Shabbat table just off Emek Refaim. Rebekka, who read Jewish Studies at Oxford, shared my passion for Jewish texts, history, and community life. Together, we embarked on what became an international Jewish journey. That journey took our family across Europe. Following my rabbinic ordinations, I had the privilege of serving vibrant, historic pulpits in Poland, first at the Nożyk Synagogue in Warsaw and later as the rabbi in Wrocław. Serving those communities deepened my appreciation for Jewish adaptability, historical resilience, and the necessity of cultivating an inviting space for every individual. Alongside the congregational rabbinate, I dappled with academia in Poland, and have spent the last decade full time in Norwegian academia (most recently as an associate professor of religion and religious education at the University of Southeastern Norway), researching and teaching 18 | Our Community News Rabbi Tyson Herberger with his wife Rebekka and their two children in Norway. on contemporary Jewish identities, representation, and interreligious engagement. A major pillar of my work has been international interrelgious dialogue and research. I have engaged with an alphabet soup of international Jewish dialogue groups, including serving for the last two years as a Senior Research Fellow at Ohr Torah’s Jerusalem Interfaith Center to promote Muslim-Jewish dialogue. My academic dialogue work has also involved sustained collaborative initiatives across Europe, including regular teaching and research at each the University of Innsbruck’s and University of Salzburg’s Faculties of Catholic Theology. Engaging in nuanced, rigorous conversation across religious traditions has consistently reinforced my belief that differences can be an extraordinary resource for mutual learning. As I step into my role at Sinai, I am gradually winding down my academic commitments outside of South Bend to dedicate my full energy, focus, and heart to our congregation and the wider local community. At my core, I am a dedicated Jewish pluralist and a firm believer in “big tent Judaism.” Halacha is not a monolithic, rigid formula, but rather a dynamic, casuistic conversation with room for authentic depth, debate, and diversity. I have always seen the Conservative movement as an organic and vital part of that halachic spectrum, and know that many of the opinions issued by the movements Committee on Jewish Law and Standards are often to the right of those coming from liberal ends of orthodoxy. To find a community like Sinai Synagogue, where serious engagement with Jewish tradition and halacha pairs naturally with an open, egalitarian spirit, was a wonderfully refreshing match. It is a place where I hope to be at home. Beyond the beit midrash and classroom, our family enjoys games, reading, and an array of other activities. Hiking has always been my favorite way to recharge, reflect, and appreciate the world around us. My son Hillel (6) is with me in hiking to mountaintops (a luxury Oslo has afforded us that will be replaced with sand dunes and river walks in Michiana), while his sister Eliana (10) channels her physical energies into taekwondo. Both my kids are eager to meet local children their age. Whether you are a regular at services, someone who joins primarily for holiday gatherings and community festivals, or someone simply looking to grab a coffee and talk about Jewish thought, ethics, or the best hiking spots in northern Indiana, my door is always open. I look forward to getting to know you, learning your stories, and working together to build a strong, inclusive, and vibrant Jewish future together. Kol tov and all the best! Rabbi Tyson Herberger Community Contributor", "OUR COMMUNITY PUBLISHED BY JEWISH COMMUNITY COUNCIL OF ST. JOSEPH COUNTY Vol. I, No. 2 SOUTH BEND, INDIANA eS September, 1946—Elul, 5706 New Council Meets Sept. 10 WELFARE FUND DRIVE RESUMED An intensified resumption of the current Welfare Fund drive is underway in an attempt to complete the work before the High Holiday period, according to Welfare Fund president, Arthur S. Simon, and Sam Brown, campaign chairman. Following the summer lag in the campaign, it is expected that all workers will cooperate in a whirlwind finish that will take the 1946 fund drive well over the top. Mr. Simon reported that ithe present total is $223,000. As ‘you know, the quota is $250,000. Said Mr. Simon: “We cannot rest until every person in our community recognizes his obligations and makes his contribution to this vital cause. Ours is a life-saving task and no one can shirk his sacred duty.” Mr. Brown, appealing to all workers to renew their efforts, issued a call for additional volunteers so that the campaign can be brought to a speedy and successful conclusion. Anyone wishing to offer his services can contact Mr. Brown at 3-3722 or can call campaign headquarters, 2-8631. Both Mr. Simon and Mr. Brown paid tribute to the splendid job done by the women’s division, under the chairmanship of Mrs. Abe Hurwich. More than $19,000 was raised by the women in this, their first organized campaign, 2=xceeding their $15,000 quota by $4,000. Calendar Serves as Clearing House As a service to all local Jewish organizations, to help them in planning affairs, major events and meetings, a Community Calendar will be maintained in the Jewish Community Office. To avoid the arranging of conflicting events organizations are urged to clear all dates with the office before making definite plans. The telephone number is 2-8631. The address: 304 Platt Building, South Bend. This service will take the place of the Clearing House which was previously conducted so ably by Mrs. A. M. Rine in a volunteer capacity and which was so much appreciated by local groups. The cooperation of all organizations in the use of the Community Calendar will help to promote mutual harmony and goodwill as well as more effective and successful vrograms. New Rabbi :- RABBI H. Z. SCHECTMAN South Bend welcomes Rabbi Harry Z. Schechtman, who has taken over the pulpit of Sinai synagogue, succeeding Rabbi Maurice Parzen. A native of New York city, Rabbi Schectman was ordained in 1933 and held numerous important pulpits before becoming an army chaplain in 1943. As a chaplain he served with the famous Tenth army in the Pacific, taking part in the invasion of Okinawa. CHRISTIAN GROUP RAISES $30,000 More than $30,000 already has been raised by the South Bend Christian Commitee for the United Jewish Appeal, it was recently announced -by Ernest M: Morris and Paul G. Hoffman, co-chairmen of the drive. Undertaken to assist the local Jewish community in ataining its 1946 objective of $250,000, a limited appeal is being made to several hundred business and civic leaders whose response to date has been splendid. The opening of the drive was marked by a luncheon at the Indiana Club at which the principa) address was given by Nelson Rock-~ efeller, chairman of the Non-Sectarian Community Committee of New York in behalf of the United Jewish Appeal. Vividly portrayine the plight of the Jews in Europe, Mr. Rockefeller told his audience: “These people, these survivors of brutal humiliations, of planned extermination, need friendship. They need to feel the handclasp of brotherhood. Their restoration to equality with their neighbors is in the best interest of mankind. If we are to preserve the principles on which our country was founded, we must make the remaining Jews a symbol of our faith in human dignity, justice and the oneness of mankind.” In addition to Mr. Morris and Edell Clarifies Some Details of New Office By MORT LINDER In order to clarify people’s ideas, as well as my own, about. what, is meant by the “reorganization” of the Jewish Community Council and its “coordination” with the program of the Jewish Welfare Fund, I decided to interview Norman Edell who has recently assumed duties as the Executive Director of the new community structure. With his social work training and _ successful Jewish community organization experience elsewhere, I figured that he probably would have the answers. Making my way to Room 304 in the Platt Building at the corner of Wayne and Michigan Streets, I was pleased to see the fine office which had been established for the Jewish community. It obviously is designed for the efficient and systematic arrangement of Jewish community affairs. As explained by Mr. Edell, the office will take care of the records of the Welfare Fund, the Community Council and its various committees and the Community Calendar or Clearing House. It will be a source of information on the activities of all the beneficiary agencies of the Welfare Fund and, through its files of Jewish Telegraphic Agency daily news bulletins, newspaper | clippings, (Continued on page four) TEMPLE SISTERHOOD | MEETS SEPT. 9 The Temple Sisterhood will hold its first meeting of the year in the form, of a luncheon to be held at 1 p. m. Monday, Sept. 9, at Temple Beth-El. Mrs. Maurice Nevel is chairman of the affair. The speaker of the afternoon will be Rabbi Albert Shulman. There will be a board meeting at the home of the president, Mrs. Sam Levy, 1750 Wilbur street, Wednesday, Sept. 4. Friday evening services, at which the Sisterhood acts as hostess, will be resumed Friday, Sept. 6 Future plans include a raffle and carnival to be held Oct. 29 in the Temple Vestry Rooms as a fund raising affair. Mr. Hoffman, other members of the committee are Rev. Charles T. Baillie, Paul M. Butler, C. F. Cunningham, Rev. Frank E. Davidson, Joseph F. Donahue, Rev. J. Hugh O’Donnell, C.S.C., Right Rev. Msgr. John S. Sabo, C.S.C., George E. Stoll and Harold S. Vance. All Organizations Are Represented Meeting At Institute Will Elect New Officers An event of the utmost importance will be the first meeting of the reorganized Jewish Community Council of St. Joseph County at 8 p. m. Tuesday, Sept. 10th at the Hebrew Institute. All organizations have been invited to send three representatives: the president of the organization and two other members. The Council body will consist of the representatives of organizations, chairmen of standing committees, the rabbis, and five members at-large, the latter to be selected at a later date. Edell to Speak The main item of business at the meeting will be an address by Norman Edell, newly-appointed Executive Director, on “The Scope and Function of a Jewish Community Council” followed by the election of officers of the Council for the coming year. Officers to be elected are the president, vicepresident, secretary, treasurer and five executive members. These together with the chairmen of the standing commitees will constitute the executive commitee. Other items on the agenda will be the reports of the Community Relations Committee, the Camp Commitee and the Community Publication Committee. It is expected that the Education Commitee will present preliminary plans for a Community Concert and Lecture Series. Representation Urged In view of the many important maters to be dealt with and the need to develop a strong local community program during the coming year all organizations are urged to see that they are properly and adequately represented. ATTENTION: ALL ORGANIZATIONS “OUR COMMUNITY” welcomes news items describing the activities and plans of your organization. All material for publication should be submitted in writing to the Jewish Community office, 304 Platt Building. As the next issue will be published at the end of September the deadline for receiving material this month will be Friday, Sept.", "Page Two OUR COMMUNITY OUR COMMUNITY Published monthly by the Jewish Community Council of St. Joseph County, South Bend, Indiana. 304 Platt Bldg. Telephone 2-8631 Norman Edell Executive Director Editor, Mort Linder EDITORIAL STAFF Mrs. H. Feferman, S. Gilman, Mrs. M. Hartstein, Miss M. Marcus, Mrs. A. M. Rine, Mrs. B. Weinstein. *‘Our Community” With this issue of “Our Community,” we begin what we trust will be a publishing career of service and benefit to the entire Jewish Community of St. Joseph County. This will be a monthly newspaper, published by the newly-reorganized-Jewish Community Council,and devoted-exclusively to news of interest to Jewish citizens in this area. In this sense it will be “your” newspaper and, therefore, will need your help and advice as we go along. The name, “Our Community,” describes perhaps most effectively the aims of the paper. And that is to present as full and complete reports on all Jewish activities as are available. The paper does not represent any factions, single organizations or any particular groups. Its news columns are open to all Jewish organizations. In short, it will be a mirror for “our community.” In communities such as ours it is all too easy for various groups and organizations to go along their own narrow paths unaware of the existence of others. One does not know, and perhaps does not care, what the other is doing or planning. With the reorganization of the Community council, an effort is being made to unify and coordinate these groups for the mutual benefit of all. It is in the building of this “community consciousness” that this newspaper hopes it can play a part. Jewish Education We hear a lot about Jewish culture and the great contributions that Jews have made to human civilization down through the ages. We are told of the many Jewish customs and traditions of old that have passed through the generations and which enrich our world of today. . But the sad fact is that all too few of our present generation are familiar with this glorious heritage. And we are faced with the stark fact that, unless steps are taken to remedy this situation, the entire Jewish cause will be immeasurably weakened in the future. The “steps to be taken” simply mean familiarizing our young people with Jewish history, giving them an idea of the magnificent traditions to which they are heirs, helping them understand what it is that has made Judaism flourish through all these thousands of years. We can do this merely by taking advantage of the available Sunday School and Talmud Torah facilities which are provided at Temple Beth-el, Sinai Synagogue and the Hebrew Institute. Our young people will be better fortified to face the problems of the future if they understand the achievements of the past. Be A Joiner ! With the beginning of a new fall and winter season, scores of Jewish organizations in our community are resuming their full schedule of activities. On page four you’ll find a listing of most of these in the “Community Calendar.” All these groups are worthy of your interest and support. Participating fully in the activities of as many of these as possible is a portion of an individual’s responsibility of the Jewish Community. Most of these organizations are open to new membership and would welcome your interest. SINAI HEBREW SCHOOL OPENS Sinai Synagogue’s Hebrew school reopened on Sept. 3rd with classes in Beginner’s Hebrew, Sidur, Chumosh, Prophets, Hebrew language and literature under the direction of Rabbi Harry Z. Schectman and with Sandor Engel as the teacher A post Bar-Mitzvah class for children over 13 years of age will be taught twice a week by Rabbi Schectman. A Station Wagon has been obtained to provide transportation for children atending the Hebrew school. Sinai’s Sunday School opens for registration on Sunday, Sept. 8th, 10 A. M. to 12 noon. The only fee for Sunday School is a registration fee of $1.00. There is also a $4.00 charge for text books which are bought when the children register. For those who -canot afford to pay, there is no charge. B’NAI B’RITH BEGINS BOWLING B’nai B’rith bowling has started the ball rolling with the election of officers for the bowling league. Elected officers for the 36-week bowling season are: Jack J. Kohen, president; Henry Paskin, vice president, and Ben Reck, secretary and treasurer. Serving with these men as the executive committee will be Sidney Berebitsky, Sam Goldstein and Dr. Marcus M. Gilman. The B'nai B’rith league is composed of 10 teams, bowling every Thursday night at 8:30 at the Bowl-Mor Recreation alleys. At the present time there are 50 bowlers and 10 substitutes. All 10 team sponsors are B’nai B’rith members. Plans have not been completed for a singles, doubles and five-man tournament. TEAMS CAPTAINS Berebitsky- 5\". een Sid Berebitsky Kay-Line Industries________Sol Gilman Sweetow’s Restaurant____Sid Goldberg S. B. Excavating Co.__---__ Mitch Kahn S. B. Baling Co.__--_ Dr. Louis Fishman Sinton Hardware Co.____ Sam. Goldstein -Henry Paskin --Ike Ochstein ----Henry Rifkin Polk Super Service___.Jules Weissbuch Editor | MORT LINDER As chairman of the Jewish Community Council publication committee, Mort Linder serves as editor of “Our Community.” Mr. Linder is news editor and chief announcer of WSBT. Hadassah Meets on Sept. 30 Hadassah will hold its first regular meeting of the year on Monday, Sept. 30, at Sinai Synagogue. The regular order of business will be taken up, to be followed by an original program entitled “Breakfast at Sara’s in Tel-Aviv” by Mrs. Ben Weinstein, who is in charge of the program. Mrs. Jordan Kapsan and Mrs. Melvin Sandock will be in charge of refreshments. A board meeting will be held Wednesday, Sept. 18, at a luncheon in the Hotel LaSalle. Mrs. Milton Hoffman is in charge. Additional hostesses for the afternoon are Mrs. Ben Levy, Mrs. Sidney Liss, Mrs. Emanuel Liss, Mrs. Harold Medow, Mrs. Melvin Sandock, Mrs. Arthur Scheer and Mrs. Ben Weinstein. SURVIVOR LISTS ARE AVAILABLE Lists of European survivors published from time to time by the various overseas agencies such as HIAS, World Jewish Congress and J.T.A. are available in the Jewish Community Office, 304 Platt Bldg. All persons trying to trace relatives or friends in Europe can consult the lists at the office. Register and Vote ! This is another general election year — of which you'll become rather painfully aware in the near future with the stories and advertisements in the papers and the speeches on the radio. However, many important offices are due to be filled in this election . . . local, state and national ... and it’s up to each and every qualified citizen to make sure that his vote is not wasted. Just remember that you cannot vote in the general election if you are not properly registered. You can check your registration easily in the registration clerk’s office in the basement of the courthouse building. If you did not vote in the May primaries or if you have moved since voting last, you have to register or else you cannot vote in November. Whether you vote Republican or Democratic is your own personal affair, but the main thing is to vote. And you cannot vote unless you are properly registered.", "OUR COMMUNITY Page Three B’NAI B’RITH WOMEN RESUME First Meeting Sept. 15; “Adopt-A-Family” Is Project By ANITA WEINSTEIN The B’nai Brith Women Chapter No. 52 of South Bend will hold the first meeting of the new season at a luncheon, at 12:45 p. m. Monday, Sept. 15, in the Indiana Club. Mrs. Arthur Scheer is chairman and Mrs. Sam Levy, co-chairman of the affair. Reports of the District Convention held in June in St. Louis will be presented, followed by a musical program. The project for the coming year is the Adopt-A-Family Project. The chairman for this project are: Mrs. Edward Haber, Mrs. Sidney Liss, Mrs. Marcus Gilman, Mrs. Harold Landau, Mrs. Lawrence Hurwick. Mrs. Albert Freedman is treasurer. This project was begun June 13 and has functioned through the summer. Packages Sent The South Bend chapter of B’nai B’rith Women has adopted five families in France and eight orphans to whom food and clothing are sent each week. Packages weighing 11 pounds each are sent to individuals. Since June 13,308 pounds of food and 440 pounds of clothing have been sent. Letters have been received from the recipients of these packages expressing gratitude and heart-warming praise for their contents. Members meet weekly on Thursday to pack these parcels for shipment. The present meeting place is Sinai Synagogue, but facilities are inadequate, and any suggestions as to space for packing facilities would be greatly appreciated. The work done is greatly needed and should be continued, so if anyone knows of any place that might be available for use to the women of B’nai B’rith for this project, please contact Mrs. Jack Strauss, at 3-6687. Clothing Drive The chapter is planning to hold a clothing drive early this fall to supplement.the material now on hand. If you have any clothing you are planning to discard please keep it for this drive, since these items are very badly needed in Europe. Indianapolis Meeting A report of a survey of the conditions of Jewish education in 20 Indiana communities will be presented at a meeting of community representatives in Indianapolis on Sunday, Sept. 8. The report will be given by Dr. Aharan Kessler, educational consultant of the Ameri- = Association for Jewish Educaion. FOR OUR RECORDS “Our Community” is sent to all Jewish homes in St. Joseph County. In order to keep the mailing-list right up to date, please notify the office (telephone 2-8631) of any changes of address and of names of new people moving into the community. DR. M. M. GILMAN HEADS VETERANS Gen. Rose Post 318 Buys Home On William St. By SOL GILMAN Dr. Marcus M. Gilman was reelected Commander of the Major Gen. Maurice D. Rose Post 318, Jewish War Veterans of the United States, at an election meeting held Aug. 20th. Irving Smith is the new senior vice commander, Hi Katz, junior vice commander, Samuel Feiwell, judge advocate, and Dr. Emanuel Liss, surgeon. The above officers and Sam Brown, Henry Lowenstein, George Neimeyer and Julius Tucker comprise the executive board. Naomi Katz was appointed adjutant and Harold Landau was reappointed Quartermaster. Others will be named to appointive offices at the beginning of the new term in September. New Home Bought Although the local post is not much over a year old, it has already taken a long stride forward, having just completed purchasing a new home. The post bought the house located at 301 S. William St. Plans for remodeling include a spacious meeting room, to accommidate the 190 active membership. Remodeling is to begin immediately and occupancy is expected early this fall. The Jewish Veterans organization took positive and dramatic action by the recent “march” to the state and national capitols, in protest of the British Government’s anti-Jewish acts. This miiitant action received much publicity and comment throughout the nation. Ladies’ Auxiliary The ground work is now being laid for the formation of a ladies’ auxiliary group, to be organized as soon as the vets move into their new home. Eligible to join will be mothers, wives, sisters and daughters. Practically’ all Jewish vets are also members of other veteran and legion groups. Plans for the immediate future include a picnic to be held at Potawatomie Park, Sunday, Sept. 8. COMING EVENTS QD. Sheed tect hte reste den Jewish War Veterans—Picnic [ee ee ee Temple Sisterhood—Opening Luncheon | a ie ee EN Hebrew Orthodox Sisterhood—Meeting Sa ees eee eer en te Sinai Sisterhood—Opening Luncheon De ese ered a Jewish Community Council—Meeting 10'S Vio ee Hebrew Institute—Rummage Sale—Afternoon 15__Hebrew Orthodox Congregation—Flag Dedication—Afternoon 16:@. Vico Saeed Sinai Sisterhood—Rummage Sale : eam oe B’nai B’rith Women’s Chapter—Opening Luncheon fs | Sere ee 8 Sere Aaa cs POC NS et ras a eh en Meee ee P Hadassah | Rockefeller Leads Appeal | Nelson Rockefeler. chairman of the Non-Sectarian Community Committee of New York for the United Jewish Appeal, meets with Ernest M. Morris, Paul G. Hoffman, and Arthur S. Simon prior to the recent luncheon of several hundred business and civic leaders in the Indiana Club. Mr. Morris and Mr. Hoffman are co-chairmen of the South Bend Christian Committee l affairs and assists in any community project that will make for a better understanding between Jewish and non-Jewish groups. ~ Agendas are planned from one meeting to the next, keeping discussions of a current nature. OUR APOLOGIES We regret the omission of the name of Robert J. Fischgrund in the list of Jewish Welfare Fund officers previously published. Mr. Fischgrund was one of the cochairmen of the campaign committee but due to the sudden onset of illness just prior to the opening of the campaign was unable to assume his duties. His fellow officers are pleased to learn that he is on the road to recovery and look forward to seeing him active again in community welfare work. This issue of “Our Community” was made possible through the courtesy of: GILBERT’S 813-817 S. Michigan St. South Bend’s Largest Store For Men.", "Page Four OUR COMMUNITY EDELL CLARIFIES SOME DETAILS OF NEW OFFICE (Continued from page one) leading Jewish periodicals, and pamphlets on interfaith relations, will be a valuable source of information on Jewish life in general, The Jewish Council, Mr. Edell said, was organized about a year and a half ago from representatives of all local Jewish organizations. Its major accomplishments were the introduction of the idea of unity, democratic participation and a population survey. A joint committee of the Council and Welfare Fund was established at the beginning of 1946 in order to enlarge, revitalize and coordinate the community program, Hitherto the chief unified community effort had been in the field of fundraising. Program Needed What was needed was a program designed to enrich local Jewish community life by activities in the field of Jewish education, .com= munity: relations, social service, recreation, camping and community publication. Such services required the continuous day to day guidance of a professional community worker. The first step of the join commitee, therefore, was to engage an Exxecutive Director to assume over-all responsibility for the initiation and direction of the desired program. In_ this respect South Bend was keeping pace with the many communities in the U. S. and Canada which have developed central community organizations with professional leadership. Since his arrival, Mr. Edell explained, he has met frequently during the summer months with the joint executive committees of the Council and Welfare Fund who have served as a planning body. The following committees have already been established and have held meetings: Jewish Education, chairman, Henry Feferman; Community Publication, chairman, Mort Linder; Camp chairman, Herold Medow; Community Relations, chairman, Dr. I. Sandock. Other commitees are in the process of formation. Committees Chosen The initiative had to be taken in the organization of these commitees in order to launch the program, make valuable use of the summer months when the Council could not meet and to formulate plans for presentation to the Council body. Committees and chairmen were selected to include people representing various groups in the community and known to have interests and abilities in particular fields. In the future, of course, regular democratic jproeedure will be followed and all commitees and chairmen will be elected in the Council. _As the central representative body of the Jewish community, the Jewish Community Council will be able to act in the name of and on behalf of the entire Jewish community. It will deal with all matters that affect the community as a whole, both internally and in relation to the general community. In this respect Mr. Edell stressed COMMUNITY CALENDAR We list for your future reference the regular meeting dates of all organizations which so far have cleared them with the Community Calendar. Please notify the Jewish Community office, 2-8631, of any changes, corrections or additigns. Daughters of Israel Sisterhood Hebrew Orthodox Congregation Hebrew Orthodox Sisterhood Temple Sisterhood Temple Mother’s Study Group Sinai Sist /* ---------- Search ---------- */
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').toLowerCase();
ISSUES.forEach(is => is.norm = is.text.map(norm));
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let searchTimer;
$('q').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 120); });
function runSearch(){
  const raw = $('q').value.trim();
  const list = $('results'); list.innerHTML = '';
  if (raw.length < 2) { $('rcount').textContent = ''; return; }
  const q = norm(raw);
  let hits = 0;
  ISSUES.forEach(is => is.norm.forEach((t, i) => {
    const at = t.indexOf(q);
    if (at < 0) return;
    hits++;
    const orig = is.text[i];
    const s = Math.max(0, at - 70), e = Math.min(orig.length, at + q.length + 90);
    const snip = (s > 0 ? '…' : '') + esc(orig.slice(s, at)) + '<mark>' + esc(orig.slice(at, at + q.length)) + '</mark>' + esc(orig.slice(at + q.length, e)) + (e < orig.length ? '…' : '');
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.innerHTML = '<div class="where"></div><div class="snip">' + snip + '</div>';
    b.querySelector('.where').textContent = is.title + ', page ' + (i + 1);
    b.onclick = () => openReader(is, i + 1);
    li.appendChild(b); list.appendChild(li);
  }));
  $('rcount').textContent = hits ? (hits === 1 ? 'Found on 1 page' : 'Found on ' + hits + ' pages') : 'No pages mention “' + raw + '.” Check the spelling or try a shorter word.';
}

/* ---------- Reader ---------- */
let cur = null, page = 1, zoom = false, lastFocus = null;
const narrow = () => window.matchMedia('(max-width:820px)').matches;
const singleMode = () => zoom || narrow();

// Spreads: cover alone, then 2–3, 4–5 … last page alone if even.
function pagesFor(p){
  const n = cur.pages.length;
  if (singleMode() || p === 1) return [p];
  const left = p % 2 === 0 ? p : p - 1;
  return left + 1 <= n ? [left, left + 1] : [left];
}
function render(dir){
  const shown = pagesFor(page);
  const sp = $('spread');
  sp.className = 'spread' + (shown.length === 1 ? ' single' : '');
  sp.innerHTML = '';
  shown.forEach((p, k) => {
    const img = document.createElement('img');
    img.src = cur.pages[p - 1];
    img.alt = 'Page ' + p;
    if (shown.length === 2 && k === 0) img.className = 'left';
    sp.appendChild(img);
  });
  if (dir && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
    sp.style.setProperty('--dir', dir > 0 ? '24px' : '-24px');
    void sp.offsetWidth; sp.classList.add('anim');
  }
  const n = cur.pages.length;
  $('pageLabel').textContent = (shown.length === 2 ? 'Pages ' + shown[0] + '–' + shown[1] : 'Page ' + shown[0]) + ' of ' + n;
  $('slider').max = n; $('slider').value = shown[0];
  $('prevBtn').disabled = shown[0] <= 1;
  $('nextBtn').disabled = shown[shown.length - 1] >= n;
  if (zoom) $('stage').scrollTop = 0;
  setHash(cur.slug + '-p' + shown[0]);
  [shown[0]-2, shown[0]-1, shown[shown.length-1]+1, shown[shown.length-1]+2].forEach(p => { if (p >= 1 && p <= n) { const im = new Image(); im.src = cur.pages[p-1]; } });
}
function go(delta){
  const shown = pagesFor(page), n = cur.pages.length;
  let target = delta > 0 ? shown[shown.length - 1] + 1 : shown[0] - 1;
  if (!singleMode() && delta < 0 && target > 1 && target % 2 === 1) target -= 1;
  if (target < 1 || target > n) return;
  page = target; render(delta);
}
function openReader(issue, p){
  cur = issue; page = Math.min(Math.max(1, p || 1), issue.pages.length);
  if (!$('reader').classList.contains('open')) lastFocus = document.activeElement;
  $('rTitle').innerHTML = '<span></span> <small></small>';
  $('rTitle').querySelector('span').textContent = issue.name || 'Our Community';
  $('rTitle').querySelector('small').textContent = issue.title;
  $('reader').classList.add('open');
  document.body.style.overflow = 'hidden';
  render(0);
  $('closeBtn').focus();
}
function closeReader(){
  $('reader').classList.remove('open');
  document.body.style.overflow = '';
  setHash('');
  if (lastFocus) lastFocus.focus();
}
function setHash(h){
  try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch(e) {}
}
function fromHash(){
  const m = location.hash.slice(1).match(/^([a-z0-9-]+?)(?:-p(\d+))?$/);
  if (!m) { if ($('reader').classList.contains('open')) closeReader(); return; }
  const is = ISSUES.find(x => x.slug === m[1]);
  if (is) openReader(is, m[2] ? +m[2] : 1);
}

$('prevBtn').onclick = () => go(-1);
$('nextBtn').onclick = () => go(1);
$('closeBtn').onclick = closeReader;
$('zoomBtn').onclick = () => {
  zoom = !zoom;
  $('zoomBtn').setAttribute('aria-pressed', zoom);
  $('stage').classList.toggle('zoom', zoom);
  render(0);
};
$('slider').oninput = e => { page = +e.target.value; render(0); };
document.addEventListener('keydown', e => {
  if (!$('reader').classList.contains('open')) return;
  if (e.key === 'Escape') closeReader();
  else if (e.key === 'ArrowRight' && e.target.type !== 'range') go(1);
  else if (e.key === 'ArrowLeft' && e.target.type !== 'range') go(-1);
  else if (e.key === 'Tab') {
    const f = [...$('reader').querySelectorAll('button:not([disabled]),input')];
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { f[f.length-1].focus(); e.preventDefault(); }
    else if (!e.shiftKey && i === f.length - 1) { f[0].focus(); e.preventDefault(); }
  }
});
let tx = null, ty = null;
$('stage').addEventListener('touchstart', e => { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, {passive:true});
$('stage').addEventListener('touchend', e => {
  if (tx === null || zoom) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  tx = null;
});
window.addEventListener('resize', () => { if (cur && $('reader').classList.contains('open')) render(0); });
window.addEventListener('hashchange', fromHash);
fromHash();
