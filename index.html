<!DOCTYPE html>

<head>

<title>Our Community Newsletter Archive | Jewish Federation of St. Joseph Valley</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --ink:#1D2330; --muted:#5A6372; --line:#D3D8E0;
  --accent:#2B47A5; --accent-ink:#FFFFFF; --hit:#FFE58A; --hit-ink:#1D2330;
  --stage:#262A33; --stage-ink:#E9ECF2; --stage-line:#3A3F4A;
  --shadow:0 1px 2px rgba(20,28,45,.08),0 12px 32px -12px rgba(20,28,45,.28);
  --logo-chip:transparent;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16191F; --surface:#1F232B; --ink:#E6E9EF; --muted:#9BA4B3; --line:#2F3440;
    --accent:#8DA8FF; --accent-ink:#121827; --hit:#5B4A12; --hit-ink:#FFF3C4;
    --stage:#0F1115; --stage-ink:#E6E9EF; --stage-line:#2A2E37;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.7);
    --logo-chip:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16191F; --surface:#1F232B; --ink:#E6E9EF; --muted:#9BA4B3; --line:#2F3440;
  --accent:#8DA8FF; --accent-ink:#121827; --hit:#5B4A12; --hit-ink:#FFF3C4;
  --stage:#0F1115; --stage-ink:#E6E9EF; --stage-line:#2A2E37;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.7);
  --logo-chip:#FFFFFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}

/* Header */
.site-head{padding:28px 0 8px}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:inline-block;background:var(--logo-chip);border-radius:10px;padding:6px 10px;margin-left:-10px}
.logo img{height:46px;width:auto}
.site-head p{margin:0;color:var(--muted);font-size:15px}

/* Hero: latest issue */
.latest{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(28px,5vw,72px);align-items:start;padding-top:40px;padding-bottom:56px}
.cover-btn{all:unset;cursor:pointer;display:block;position:relative;border-radius:3px}
.cover-btn img{width:100%;height:auto;aspect-ratio:612/792;object-fit:cover;border-radius:3px;box-shadow:var(--shadow);background:var(--surface)}
.cover-btn:hover img{transform:translateY(-3px)}
.cover-btn img{transition:transform .25s ease}
.cover-btn:focus-visible{outline:3px solid var(--accent);outline-offset:6px}
.latest h1{font-size:clamp(38px,5.2vw,64px);line-height:1.02;letter-spacing:-.02em;font-weight:700;margin:6px 0 10px}
.kicker{font-size:16px;color:var(--muted);margin:0}
.hebrew{color:var(--muted);margin:0 0 26px;font-size:18px}
.read{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:13px 24px;font-weight:600;font-size:17px;cursor:pointer}
.read:hover{filter:brightness(1.08)}
.toc{margin:40px 0 0;padding:0;list-style:none;border-top:1.5px solid var(--ink)}
.toc h2{font-size:15px;font-weight:600;margin:0}
.toc-title{font-size:20px;font-weight:600;margin:36px 0 10px}
.toc li{border-bottom:1px solid var(--line)}
.toc button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 20px;width:100%;padding:12px 2px}
.toc button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toc .t{font-weight:500;line-height:1.3}
.toc .by{grid-column:1;color:var(--muted);font-size:15px;line-height:1.3}
.toc .pg{grid-column:2;grid-row:1 / span 2;align-self:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.toc button:hover .t{color:var(--accent)}

/* Search */
.search{border-top:1px solid var(--line);padding:44px 0 56px}
.search h2,.issues h2{font-size:26px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.search p.help{margin:0 0 18px;color:var(--muted)}
.field{position:relative;max-width:620px}
.field input{width:100%;font:inherit;font-size:18px;padding:14px 18px 14px 48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.field input:focus{outline:none;border-color:var(--accent)}
.field svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{list-style:none;margin:22px 0 0;padding:0;max-width:760px}
.results li{border-bottom:1px solid var(--line)}
.results button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:14px 2px}
.results button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.results .where{font-size:15px;color:var(--muted)}
.results .snip{margin-top:2px;line-height:1.45}
.results mark{background:var(--hit);color:var(--hit-ink);border-radius:3px;padding:0 2px}
.results-count{margin:18px 0 0;color:var(--muted);font-size:15px}

/* Earlier issues */
.issues{border-top:1px solid var(--line);padding:44px 0 56px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:28px 22px;margin-top:20px}
.grid button{all:unset;cursor:pointer;display:block}
.grid img{aspect-ratio:612/792;width:100%;object-fit:cover;border-radius:2px;box-shadow:var(--shadow)}
.grid span{display:block;margin-top:10px;font-weight:500}

.site-foot{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:15px}
.site-foot p{margin:0}

/* Reader */
.reader{position:fixed;inset:0;z-index:20;background:var(--stage);color:var(--stage-ink);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.reader.open{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:10px clamp(10px,2vw,20px);border-bottom:1px solid var(--stage-line);flex:none}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.bar .title small{font-weight:400;opacity:.7;margin-left:8px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:42px;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--stage-line);background:transparent;cursor:pointer;color:var(--stage-ink);font-size:15px}
.ibtn:hover{background:rgba(255,255,255,.08)}
.ibtn[aria-pressed="true"]{background:var(--stage-ink);color:var(--stage)}
.ibtn:focus-visible{outline:3px solid #8DA8FF;outline-offset:2px}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.spread{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(10px,2.4vh,28px) clamp(56px,7vw,96px);gap:0}
.spread img{height:auto;width:auto;max-height:100%;max-width:50%;background:#fff;box-shadow:0 10px 40px -10px rgba(0,0,0,.6)}
.spread.single img{max-width:100%}
.spread img.left{box-shadow:-6px 10px 40px -10px rgba(0,0,0,.6),inset -18px 0 24px -20px rgba(0,0,0,.35)}
.spread.anim{animation:fadein .28s ease}
@keyframes fadein{from{opacity:0;transform:translateX(var(--dir,0))}to{opacity:1;transform:none}}
.stage.zoom{overflow:auto}
.stage.zoom .spread{position:static;display:block;padding:16px}
.stage.zoom .spread img{height:auto;width:100%;max-height:none;max-width:1224px;margin:0 auto 16px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--stage-line);background:rgba(15,17,21,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.nav:hover{background:rgba(15,17,21,.85)}
.nav[disabled]{opacity:.25;cursor:default}
.nav.prev{left:clamp(6px,1.4vw,22px)}
.nav.next{right:clamp(6px,1.4vw,22px)}
.nav:focus-visible{outline:3px solid #8DA8FF;outline-offset:2px}
.stage.zoom .nav{position:fixed}
.foot{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px;border-top:1px solid var(--stage-line);font-size:15px;font-variant-numeric:tabular-nums}
.foot input[type=range]{width:min(420px,50vw);accent-color:#8DA8FF}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:820px){
  .latest{grid-template-columns:1fr;padding-top:24px}
  .latest .cover-col{max-width:360px}
  .bar .title small{display:none}
  .spread{padding:10px 10px}
  .nav{width:40px;height:40px;top:auto;bottom:12px;transform:none}
}
@media (max-width:560px){ .ibtn .lbl{display:none} }
@media (prefers-reduced-motion:reduce){ .spread.anim{animation:none} .cover-btn img{transition:none} }
</style>
</head>

<script>
const ISSUES = [{"slug": "2026-11-nov-dec", "name": "Our Community", "title": "November–December 2026", "hebrew": "Cheshvan–Kislev–Tevet 5787", "pages": ["issues/2026-11-nov-dec/01.webp", "issues/2026-11-nov-dec/02.webp", "issues/2026-11-nov-dec/03.webp", "issues/2026-11-nov-dec/04.webp", "issues/2026-11-nov-dec/05.webp", "issues/2026-11-nov-dec/06.webp", "issues/2026-11-nov-dec/07.webp", "issues/2026-11-nov-dec/08.webp", "issues/2026-11-nov-dec/09.webp", "issues/2026-11-nov-dec/10.webp", "issues/2026-11-nov-dec/11.webp", "issues/2026-11-nov-dec/12.webp", "issues/2026-11-nov-dec/13.webp", "issues/2026-11-nov-dec/14.webp", "issues/2026-11-nov-dec/15.webp", "issues/2026-11-nov-dec/16.webp", "issues/2026-11-nov-dec/17.webp", "issues/2026-11-nov-dec/18.webp", "issues/2026-11-nov-dec/19.webp", "issues/2026-11-nov-dec/20.webp"], "text": ["November–December 2026 Cheshvan–Kislev–Tevet 5787 Our Community Federation Means Family Children and their families enjoy PJam storytime inside the newly reimagined PJ library at the Jewish Federation of St. Joseph Valley. Families are welcome to drop in on Thursdays from 10 AM to 4 PM to enjoy the space. More information on page 14.", "F R O M T H E E X E C U T I V E D I R E C TO R Living Jewishly, Together Fourteen years after joining Federation’s staff, Emily Benedix shares three lessons she has learned about Jewish life. In our last issue, I highlighted the impact your gift made on Jewish lives. When I began working for the Jewish Federation of St. Joseph Valley in 2012, I knew I had a lot to learn, but I never imagined the biggest lesson would be what it means to live a Jewish life. Even as a Jew, I found that what I thought I knew about living Jewishly was incomplete. Prior to joining the staff, I was actively involved in volunteering at Federation and teaching Sunday School at Temple Beth-El, so I thought I had figured it out. As it turns out, that was just the beginning. Fourteen years later, there are still times when I find myself reflecting on what living Jewishly means. I still consider myself at the beginning of my learning journey, as learning never ends, but there are a few things I know for certain. First, there is no single definition of living Jewishly. Regardless of affiliation, level of observance, or how someone expresses their Jewish identity, living Jewishly looks different for every person. Even within a person’s own practices, it may look different depending on where they are in life. The stories I’ve heard from our speakers and, more importantly, our community members each offer a unique perspective that weaves into the greater history of the Jewish people. Living a Jewish life in Israel looks different than it does in Budapest, Argentina, Chicago, or South Bend. A child preparing for their Bar or Bat Mitzvah may have very different needs and experiences than a lifelong community member seeking connection in retirement. Second, living Jewishly can be difficult, no matter what it looks like. For some, the challenges are greater than for others, but challenges exist all the same. The size of the local Jewish population, access to kosher foods, the acceptance of Jews by those around us, our political 2 | Our Community | November–December 2026 Photo courtesy of Jewish Federations of North America beliefs, and how visibly Jewish we are can all have a significant impact on how easily we embrace Judaism in our daily lives. For those seeking meaningful peer relationships in a small Jewish community, where does one go in a region best known for a Catholic university? For students who must take time out of their day to explain to friends why a Holocaust joke isn’t funny, being Jewish is far from easy. For a Jewish individual living in an area where many social service and support agencies are rooted in Christian traditions, finding culturally appropriate help can be challenging. For congregations struggling to balance budgets that must accommodate both Kiddush lunches and armed security, providing welcoming Jewish spaces can feel difficult and overwhelming. But the third lesson I learned is that, in many ways, the most important factor in living a Jewish life is community. All the factors I’ve mentioned above are impacted by the presence of community. More than simply where we are, community is ingrained in us through where we’ve been. Throughout Jewish history, one thing has remained central: community. We see it in the stories of the tribes of Israel and in the celebrations of our holidays. Even many of our prayers and traditions emphasize gathering together. Our mourning traditions often bring us together in a minyan, as does the public reading of the Torah. Many of my friends host Passover Seders that are larger than their dining tables can comfortably accommodate, and a good game of Jewish geography is always a wonderful way to", "find a connection. Yet in smaller cities such as ours, finding those Jewish connections can sometimes be a challenge. Here in Northern Indiana and Southwest Michigan, we are fortunate to have congregations that provide for the spiritual and religious needs of our community. Our Federation has a unique role as a central cultural and communal resource for all Jews, whether affiliated with a congregation or not. We pride ourselves on bringing together people from across our congregations, as well as those who seek connection to Jewish life outside the walls of a synagogue. Beyond that, we are proud of the network of Jewish organizations that serve as our partners in this corner of the world. We recognize that because Jewish life is so deeply connected to community, the strength of each organization, congregation, and individual contributes to the strength of our community. We are grateful for the opportunities our donors have given us to be part of this network and this community. Their generosity allows us to create spaces for connection, celebrate our shared traditions, support one another through challenges, and ensure that Jewish life continues to thrive in our region. Looking back on what I’ve learned over the past fourteen years, perhaps the most important lesson is that living Jewishly isn’t something we have to figure out on our own. It is something we learn, experience, and strengthen together. No matter where you are in life, how you practice Judaism, or how you express your Jewish identity, there is a place for you in our community. We invite you to find that connection at Federation, because a strong Jewish community isn’t defined by how many people it serves, but by the sense of belonging it creates for each of them. Emily Benedix Executive Director emily@thejewishfed.org (574) 233-1164 ext. 1802 A Celebration in Song Your IT Department Too small to have a fulltime IT person on staff? We provide complete IT outsourcing. Ravitron will do anything your inhouse person could do, and more, for a fixed monthly cost. (574) 674-1500 www.Ravitron.com Benefits: 24 hr. Security from Online Threats Cloud Back Up Phone, Internet, Microsoft Office 365 & more on one bill In-Person Support On November 5, we officially launched our 2027 Annual Campaign, The Power of Community, with an evening of music and celebration. Listen Up, a Jewish a cappella group from Skokie (pictured above), joined us in concert and filled the room with unfiltered Jewish joy. Thank you to our Kickoff co-chairs, Steven Richter and Lily Shroyer, and our honorary chair, Lynda Simon, for their leadership in bringing our community together to begin this year’s campaign. Our Community | November–December 2026 | 3", "W H Y I G I V E TO T H E A N N UA L C A M PA I G N I Have Seen the Power of Community Firsthand Co-chair Terry Feldbaum shares a lifetime of moments, in Michiana and around the world, that show why her gift to the Annual Campaign matters, and why yours does too. The following is adapted from remarks Terry Feldbaum delivered at the 2027 Campaign Kickoff on November 5, 2026. I grew up in South Bend, and I not only went to Camp Ideal but was also the Arts & Crafts Director at camp during my college years. My first exposure to Federation as an adult was in 1982, when I moved to Chicago looking for a change in life after losing my first husband in a car accident. I received career counseling from Jewish Vocational Services at the Jewish Federation of Chicago, which helped me find a position teaching autistic children at Michael Reese Hospital. Over the next eight years, I joined the Young Leadership Board of Chicago’s Jewish Federation. My friends from the Young Leadership Board introduced me to my husband, Alan Feldbaum, at the singles dinner at the General Assembly (GA). We married and moved to South Bend in 1988. So I ask you: Why should you make a gift to our local Jewish Federation? Everyone in this room can answer that question differently. I make my gift every year because I have witnessed firsthand the work our Federation does every day. I have seen it from my days as a camper, and in the youth and teen programs, sponsored by our local Federation, that our children participated in growing up. I have seen it in our Federation’s resettlement of more than 100 Jews from the former Soviet Union in South Bend, and in our special campaigns to raise funds to rescue the Jews of Ethiopia. I have seen it on my visits to our Federation’s Partnership community in the Western Galilee, where I watched Arab and Jewish teens play chess together and learn to dialogue with one another at Akko’s community center. And I have seen it in Venice, at a synagogue that survived World War II, where I had lunch with members of the local Jewish community, a community supported by the dollars we give to the Joint Distribution Committee. I have seen us identify the needs over and over again, and then roll up our sleeves and raise the necessary funds to do our part, together with other Jewish communities throughout the world. This is why I give to our local Federation’s Annual Campaign every year, and why I have chosen to chair the campaign year after year, this year adding Steven Richter as my co-chair. I hope you will join me in making your pledge this evening. Terry Feldbaum Annual Campaign Co-Chair Terry Feldbaum (left) and Cristyne & Jim Porile (right) speak at the Jewish Federation’s Campaign Kickoff on Nov. 5. 4 | Our Community | November–December 2026", "2027 Annual Campaign Totals as of November 19, 2026. $114k $229k raised of our $457,000 goal $379,602 $343k $457k 83% of the way there. $77,398 to go. Every gift and pledge keeps Jewish life thriving across Michiana, for this generation and the next. Thank you to everyone who has already given. Join us. Make your gift or pledge today at TheJewishFed.org/2027 Scan to give I N T R O D U C I N G M O N R O E L E M AY- E M E R I C K , D I R E C TO R O F P R O G RA M M I N G New Chapter, A Familiar Community Monroe Lemay-Emerick brings years of work in the arts, education and community building, along with a longtime connection to Federation, to a new role creating programs that celebrate Jewish life. among cultural organizations, educational institutions, and community partners. Shalom! It is a wonderful feeling to begin this new chapter as Director of Programming at the Jewish Federation of St. Joseph Valley. Although my position is new, my connection to Federation and the people who make this community so special is not. My involvement with Federation has been especially meaningful. What began with volunteering and a shared love of the arts has grown into an opportunity to contribute more directly to a community and mission I care deeply about. My journey has taken me through many places, cultures, and experiences, each shaping my belief in the importance of community, education, creativity, and human connection. As an Israeli-American Jew who spent part of my childhood growing up on Kibbutz Sarid in Israel, I have always held my Jewish heritage as an important part of who I am. Those early experiences helped shape my appreciation for community, shared responsibility, and the traditions that connect us across generations. My professional life has included many years working in the arts, nonprofit leadership, education, fundraising, and community development. During my years in New York City, I worked closely with artists, galleries, and educational organizations, including nine years mentoring students through the City-As-School program. More recently, my work in Southwest Michigan has allowed me to continue building relationships As Director of Programming, I look forward to listening, learning, and working alongside our staff, volunteers, and community members to develop programs that celebrate Jewish life, strengthen our connections to Israel, encourage lifelong learning, and bring generations together. Most importantly, I look forward to getting to know more of you, hearing your stories, and discovering what we can create together. Monroe Lemay-Emerick Director of Programming monroe@thejewishfed.org (574) 233-1164 ext. 1811 Our Community | November–December 2026 | 5", "CO M B ATT I N G A N T I S E M I T I S M Holocaust Education is Needed Now More Than Ever Dennis Kaplan explains how Federation’s Holocaust education helps local students examine propaganda, obedience and moral courage, and why that work matters more than ever. What should a young person do when a government official, military commander, employer, or crowd demands something that is morally wrong—or clearly illegal? This is not merely a historical question. It is among the most important questions a democracy can teach its children to confront. For students in grades 8 through 12, Holocaust education from the Jewish Federation of St. Joseph Valley provides a powerful way to examine antisemitism, propaganda, prejudice, obedience, moral courage, and the responsibilities of citizenship. The Holocaust was the systematic, state-sponsored persecution and murder of six million European Jews by Nazi Germany and its collaborators. Millions of other people were also persecuted and murdered. Students must understand the Holocaust’s specifically antisemitic purpose and the destruction of Jewish families, communities, and culture. They must also learn that the killing did not begin with concentration camps and gas chambers. It was preceded by hateful language, conspiracy theories, discriminatory laws, public humiliation, economic exclusion, confiscation of property, forced removal, and the gradual acceptance of cruelty. Teaching dates and death tolls is necessary, but it is not enough. Students must also study individual choices. The Nazi system depended not only on dedicated Nazis but also on civil servants, police officers, railroad employees, business owners, professionals, and neighbors who helped carry out—or failed to resist—persecution. The United States Holocaust Memorial Museum explains that the word “bystander” can hide many degrees of participation and responsibility. The question is not simply, “Who was evil?” It is also, “What did ordinary people do when the humanity of another person was placed in their hands?” Federation helps local schools explore these questions in historically accurate and personally meaningful 6 | Our Community | November–December 2026 Bob Feferman presents to a class of South Bend students. ways. In addition to providing educators with classroom resources, Federation offers a Holocaust Education Speakers Bureau. The bureau’s programs, currently listed for grades 8–12, include survivor family histories, racism and the Holocaust, heroism, rescue, and remembrance. Speakers are available for both in-person and virtual presentations. They bring something into the classroom that a textbook cannot provide: a human voice and a personal connection to history. That connection becomes increasingly important as the survivor generation grows smaller. Students may forget a list of laws, but they are more likely to remember hearing how those laws affected a child or family. A speaker can help students understand that six million was not an abstract number, but rather the number of individuals— with names, families, talents, beliefs, and hopes—who perished in the Holocaust. Hannah Arendt’s phrase “the banality of evil” offers another important framework for understanding. After observing the 1961 trial of Adolf Eichmann, an organizer of the deportation of Jews to the death camps who stayed very much in the background, Arendt examined his bureaucratic language and his refusal to think morally about his actions. She was surprised that such a quiet, unassuming individual could be responsible for the", "murder of millions of people. She did not mean that evil was ordinary or harmless. Her warning was that terrible crimes can be carried out through routine procedures when people surrender their judgment, hide behind authority, and reduce human beings to numbers or entries on a form. Evil does not always appear in the form of an obvious monster. Sometimes it is expressed through the defense Eichmann offered at his trial in Jerusalem: that he was only following orders. This leads directly to the question of unlawful orders. The Nuremberg Principles established that an order from a government or superior does not free a person from responsibility under international law when a moral choice was possible. This does not mean that people may disregard any law or order they dislike. It means that authority has limits and that manifestly unlawful orders do not become lawful simply because a powerful person issued them. The My Lai massacre during the Vietnam War makes this lesson painfully relevant to American history. On March 16, 1968, American soldiers killed hundreds of unarmed Vietnamese civilians, including children. Some participants claimed that they were only following orders. Army helicopter pilot Hugh Thompson Jr. and his crew demonstrated that another choice was possible. Thompson landed his helicopter between American troops and civilians, ordered his crew to protect the civilians if necessary, helped arrange their evacuation, and reported what he had witnessed. His actions teach students that patriotism is not blind obedience. Loyalty to one’s country may require the courage to prevent wrongdoing by one’s own side. acceptable? Are courts and constitutional limits being respected? Are people being asked to violate their legal or ethical responsibilities? Effective Holocaust education does not tell students which political party to support. It teaches them how to examine power, recognize propaganda, reject antisemitism, evaluate evidence, defend due process, and respond when others are endangered. “Never again” cannot be a hollow refrain repeated without conviction. It must become a state of mind. Holocaust education cannot guarantee that every student will make the courageous choice, but it can ensure that students understand that a choice exists. In 2024, the Anti-Defamation League said that the total number of antisemitic incidents in the United States was up 893% over the past 10 years. When Jews become a stand-in for everything a society fears or resents, antisemitism spreads very quickly. That is why the past 10 years matter: they show antisemitism moving from the margins into politics, protest culture, digital life, and ordinary public behavior. That is why this education belongs in our schools—and why the work of the Jewish Federation of St. Joseph Valley is needed now more than ever. Dennis Kaplan Community Contributor These lessons remain important in current American debates about immigration enforcement, detention, executive power, and due process. Americans may disagree about immigration policy and how laws should be enforced. Nevertheless, government language and actions should always be subject to constitutional and moral scrutiny. This does not mean that the United States today is Nazi Germany or that every controversial policy leads to another Holocaust. Such comparisons can distort history and diminish the Holocaust’s unique significance. The responsible connection is found in warning signs and moral questions: Is an entire group being portrayed as dangerous? Is dehumanizing language becoming Our Community | November–December 2026 | 7", "PA RT N E RS H I P 2 G ET H E R Reflections From My Partnership Trip to Israel Partnership2Gether co-chair Kim Cossman shares five days of resilience and remembrance. First, I would like to express my sincere gratitude to the Jewish Federation of St. Joseph Valley for giving me the opportunity to participate in this trip to Israel. It was an experience I will never forget. Thank you for placing your trust in me to represent our community. This was truly a once-in-a-lifetime opportunity, and I am deeply grateful for the memories, relationships, and perspectives I gained throughout the journey. Sunday, October 11: Arrival in Israel and the Western Galilee My journey to the Western Galilee began with flights from South Bend to Chicago, then Newark, and finally Israel. I managed to sleep only about an hour on the flight to Israel, likely because of a combination of nerves, excitement, and the uncertainty of what to expect. Traveling alone added to my nervousness, but I was determined to make the journey. After arriving in Israel, I successfully navigated customs, boarded the train to Nahariya, took a taxi, and arrived at the Jacob Sea Life Hotel. I had very little time to settle in before a taxi arrived to take me to the new Partnership building. The building was beautiful, and I was excited to begin the program. Shortly after arriving, our group boarded a van and traveled to Kibbutz Hanita, located near the northern border with Lebanon. We heard from the head of security about life on Kibbutz Hanita, which is located approximately 50 yards from the Lebanese border. Standing in an area that had been bombed during the war was an intense and sobering experience. Despite the challenges the community had faced, we learned how its residents had worked to rebuild their lives. The kibbutz’s kindergarten, similar to a preschool in the United States, was operating again, and its distillery had resumed production. Following our visit, we toured Julius Distillery and learned how its gin and other spirits are produced. One particularly interesting aspect of the operation was that its products depend on whatever fruit the local farm delivers. The ingredients might be berries, plums, apricots, or something else entirely. The distillery also offered beautiful views of the Western Galilee. Later that evening, we gathered for dinner with guests invited by Partnership. I was delighted to see Sarit Friedman, a member of the Chef Delegation that had previously visited our community to prepare meals for us. It was wonderful to reconnect with her and hear how she was doing. Our hosts encouraged everyone to sit with an American guest, creating a welcoming atmosphere for conversation and connection. The meal was exceptional, with an abundance of salads, dips, fish, chicken, and other dishes. After more than 24 hours of traveling, I Kim Cossman (top row, second from left) joins fellow Partnership2Gether travelers overlooking the Mediterranean Sea at Rosh HaNikra, near Israel’s northern border with Lebanon 8 | Our Community | November–December 2026", "was grateful for the hospitality and the opportunity to begin reconnecting with people I had met through our community’s Partnership relationships. Monday, October 12: Holocaust Education, Resilience, and Akko We began Monday at the Ghetto Fighters’ House Museum, a Holocaust museum with extensive exhibits documenting the experiences of the Jewish people before, during, and after the Holocaust. One particularly moving exhibit featured books containing records of Jewish people taken into custody by the Germans, available in both English and Hebrew. As we moved quietly through the museum, our guide shared the history behind the exhibits and the events they represented. The museum was thoughtfully designed, and I wish we could have spent more time there. Although our visit lasted only two and a half hours, it was a meaningful opportunity to reflect on Jewish history and the importance of preserving the memories of those who suffered and perished. Our next stop was the opening ceremony for the new Resilience Center at Western Galilee College, established with generous support from Partnership communities, particularly the Jewish Federation of Greater Indianapolis. Rebecca Schalit-Newman, the new Executive Director of the Indianapolis Federation, spoke at the ceremony. The center is designed to help soldiers cope with posttraumatic stress disorder (PTSD), anxiety, and the psychological effects of traumatic experiences. During our tour, we experienced a virtual reality simulation designed to demonstrate some of the center’s therapeutic approaches. Participants wore a vest, a watch, and a virtual reality headset while holding a simulated weapon. The scenario recreated the events of October 7. Throughout the simulation, I felt the vest vibrate to indicate that I had been shot, and I found myself responding to the situation as though it were real. Afterward, one of the facilitators observed that I appeared nervous. He explained that my breathing and perspiration had revealed my anxiety. He then discussed the techniques the center uses to help soldiers manage their responses to trauma, including breathing exercises. Experiencing even a simulation of such a frightening situation gave me greater appreciation for the emotional challenges these soldiers face and the importance of providing them with effective support. It was an experience I will not soon forget. We continued to the Crusaders Hall in the Old City of Akko, where an archaeologist who had participated in excavations guided us through the historic site. As someone who loves history, I thoroughly enjoyed learning about the hall and how it had been discovered. Walking through the narrow streets of the Old City made it easy to imagine what life might have been like centuries ago. We also visited the home of a Muslim woman who graciously welcomed us inside. Her home was reached by climbing a steep staircase of approximately 50 steps, but the effort was rewarded with a beautiful view of the sea and the Old City from her balcony. She prepared refreshments for us and shared her home with remarkable warmth and generosity. That evening, I was fortunate to be hosted for dinner by Chef Inon Carmel, another member of the Chef Delegation who had visited our community. I had the pleasure of meeting his wife, son, and daughter and enjoying a wonderful meal together. Chef Inon prepared kubbeh, a traditional dish featuring meat-filled dough served in a lemon-based broth. He was kind enough to share his grandmother’s recipe with me. For dessert, he served kanafeh, a delicious dish made with shredded pastry and cheese, topped with sweet syrup. Beyond the wonderful food, the evening was especially meaningful because of our conversations about life near the Lebanese border. His daughter showed us a video of what it looks like when the Iron Dome intercepts a rocket and spoke about the experience of living so close to the border while missiles are being launched into Israel. Her courage, and the courage of her entire family, left a lasting impression on me. Despite the challenges they have endured, they have chosen to continue living their lives on their kibbutz. They are not allowing the war to define their future or force them to live in fear. Chef Inon spoke enthusiastically about plans for the community’s olive harvest and producing olive oil. He also drove us around the kibbutz, pointing out important places and sharing more about the community. Kim Cossman Co-Chair, Partnership2Gether Committee Our Community | November–December 2026 | 9", "CO M M U N I TY R E LAT I O N S CO M M I TT E E Israel After the Election: Watch Our Conversation with Dan Ferman What do Israel’s recent elections mean for the country’s future, and how might the results shape its relationships with the United States and the broader Middle East? If you missed our recent conversation with Dan Feferman, South Bend native, Israeli national security analyst, and co-founder and CEO of Middle East 24, the full program is now available to watch! Watch the replay at TheJewishFed.org/Feferman. YO U T H & FA M I LY P R O G RA M M I N G Hanukkah Together: A PJam for Kids & Their Grown-Ups A little light, a little jelly, and a whole lot of togetherness! PJam families, join us on Sunday, December 6 at 5:30 PM inside South Bend’s Morris Performing Arts Center! We’ll start with family Hanukkah activities, then join the community to light the giant chanukiah in the plaza at 6:30 PM Have an older child who’d like to be one of my PJam Stars? Let Nurit know by emailing Nurit@thejewishfed.org — we’d love their help with the activities! Register to attend at TheJewishFed.org/PJam. D OW N TOW N S O U T H B E N D M E N O RA H L I G H T I N G Community Chanukah Celebration at the Morris Join our local Jewish community for a special Chanukah celebration in the heart of downtown South Bend on Sunday, December 6 at 6 PM. We’ll gather inside the Morris Performing Arts Center to hear from community leaders and celebrate the third night of Chanukah together. Following the indoor program, we’ll briefly step outside to the plaza around 6:30 PM for the lighting of the third night’s candles on the giant chanukiah. Special thanks to the South Bend Police Department for providing security for this event. RSVP to attend at TheJewishFed.org/DTSB. 10 | Our Community | November–December 2026", "M I C H I A N A J E W I S H H I STO R I C A L S O C I ETY Honoring Our Legacy, Shaping Our Future Join Michiana Jewish Historical Society for their Annual Meeting at the Jewish Federation on Sunday, December 13 at 2 PM, followed by a community reception. The program will feature a 45-minute panel discussion with past Federation presidents spanning multiple decades, exploring key community milestones—including leadership transitions, building developments, women’s leadership opportunities, and campaign priorities—concluded by a 15-minute Q&A session. Register to attend at MichianaJewish.org. J E W I S H FA M I LY S E RV I C E S Understanding Your Medicare Options Home health, palliative care and hospice are very different kinds of care. Jewish Family Services invites you to learn how Medicare covers each one, whether you’re planning ahead or caring for someone you love. A hospice consultant and a registered nurse from Luminary Hospice will explain your options in plain language and answer your questions. Join us Thursday, December 17, at 7 PM at the Jewish Federation. Bring a friend who could use this information too. Register to attend at TheJewishFed.org/Medicare. FA L L F I N E A RTS E X H I B I T I O N The Colorful World of Natalie Klein: An Artist Retrospective Selected works from The Colorful World of Natalie Klein: An Artist Retrospective are available for purchase at the Jewish Federation. For more than 50 years, Klein has painted Michiana’s skies and stones in bold, joyful color. Now one of her paintings can hang on your wall. A portion of proceeds supports the Jewish Federation of St. Joseph Valley. See the work Monday through Friday, 10 AM to 3 PM, through January 15. To ask about a piece, contact Monroe Lemay-Emerick at monroe@thejewishfed.org. Our Community | November–December 2026 | 11", "CO M M U N I TY S E C U R I TY The Incidents We Don’t See: Understanding Antisemitism in Our Community A national survey found that most American Jews who experience antisemitism never report it. Emily Benedix explains why that matters, and how a new Federation reporting system will help our community see the full picture. In February, the American Jewish Committee (AJC) released its report, The State of Antisemitism in America 2025. Sadly, the numbers reported weren’t all that surprising to those in the Jewish community, given what we have experienced in recent years. • 93% of American Jews recognize that antisemitism is a problem in America, with 91% saying they felt less safe because of violent incidents that occurred in 2025. • 55% changed at least one behavior out of fear of antisemitism, an increase of 9 percentage points since 2023. What was most shocking to me, however, was the number of incidents that went unreported. Of the Jews who experienced antisemitism directed at them personally, 77% did not report the incident. Why? Because 54% didn’t believe anything would be done, and 44% didn’t think the incident was severe enough to warrant reporting. This tells us two significant things: • The absence of a formal report does not mean the absence of antisemitism. • Skepticism about outcomes is a significant barrier to reporting. This brings to mind the many times I’ve tried to explain concerns about antisemitism and its impact on Jewish lives over the years. I’ve encountered dismissive responses from law enforcement, casual acquaintances, and even other Jews. Even with confirmed data, personal experiences, historical context, and global patterns, asking others to understand where I was coming from often felt like a stretch. This is especially true in today’s climate, when concerns about antisemitism are sometimes dismissed without thoughtful discussion. Honestly, it can get exhausting. But there is a bigger picture to consider. If 77% of those experiencing antisemitism aren’t 12 | Our Community | November–December 2026 reporting it, our understanding of the problem is incomplete. A police department that isn’t aware of harassing statements being made on the street cannot recognize a pattern. If something happens in Granger and those on the south side of town are unaware, how can any of us appropriately assess what is happening in our community as a whole? Without reporting, we are left with an incomplete picture of the antisemitism affecting our community. The Jewish Federation of St. Joseph Valley has begun developing a centralized, accessible reporting system that will serve our entire community. Working directly with our congregations and our partners at Secure Community Network (SCN), we are building a formal procedure to report, track, and, whenever possible, address incidents of antisemitism in our community. The success of this system will depend on our community’s support and willingness to report incidents. Whether it’s a comment made in a school hallway, someone yelling at you as you pass them on the street, or graffiti on an underpass, we want to know. All reports will be treated confidentially. Once we receive a report, we will notify the appropriate authorities, as well as SCN and national reporting organizations such as AJC and the Anti-Defamation League (ADL), so that incidents can be tracked on a national scale. This data can help government and law enforcement officials better recognize patterns and emerging threats, respond appropriately, and allocate resources to support our community. Our tracking data will also be available to congregations and Jewish organizations in our service area applying for security grants, helping them demonstrate the needs and concerns of our community. In the coming weeks, Federation will add a reporting feature to our website where community members can quickly report an incident at any time of day. Until then, we encourage you to call our office at (574) 233-1164 or email myself or Dan Cossman (dan@thejewishfed.org).", "If you are experiencing an emergency or are in immediate danger, always contact law enforcement first. Incidents involving criminal activity, such as physical assault or vandalism, should also be reported directly to the police. Even with the trend of underreporting, I still consider our region to be a safe and welcoming place for our Jewish community. This was a national survey and does not necessarily reflect the experiences of our local community. By establishing an accessible and efficient reporting system, we hope to develop our own benchmarks, better understand the concerns that exist locally, and respond to them more effectively. Ultimately, reporting antisemitism isn’t just about documenting what has happened. It’s about recognizing patterns, protecting one another, and ensuring that the experiences of our community are neither overlooked nor dismissed. Every report, no matter how small an incident may seem, helps us build a more complete picture and strengthens our ability to advocate for the safety and wellbeing of Jewish life in St. Joseph Valley. Emily Benedix Executive Director emily@thejewishfed.org (574) 233-1164 ext. 1802 CO M M U N I TY R E LAT I O N S Thank You, Barbara Lerman: A Decade of Opening Hearts As Barbara Lerman retires as chair of the Community Relations Committee, Bob Feferman reflects on her vision and hospitality. It was my honor to work with Barbara Lerman for the past decade in her role as chair of the Community Relations Committee (CRC). It is thanks to her vision and strong leadership that CRC had many accomplishments. Just one example is in the area of interfaith relations. Several years ago, Barbara suggested that we meet with the leadership of the Muslim community to brainstorm ideas for collaboration. Our friend Haider Al Kilidar, an Iraqi refugee who settled in our community, helped arrange a meeting with the leadership of the local mosque. During a meeting with Imam Mohammed Sirajuddin; Dr. Ismail al-Ani, president of the mosque’s board; Haider; John Pinter of United Religious Communities (URC); Barbara; and me, we came up with a unique idea. Together, we would support a computer literacy training course for women of the Iraqi refugee community. Thanks to the help of John Pinter, the idea came to fruition. But Barbara didn’t stop there. At the meeting, she invited everyone to dinner at her house. And she didn’t mean just the six of us. Barb invited the entire board of the mosque and their spouses, the board of the Jewish Federation of St. Joseph Valley and their spouses, local rabbis, and members of the Iraqi refugee community. In total, there were more than 80 people at her house. The evening was an unforgettable example of how we can build interfaith relations through warm hospitality. This is just one example of how Barbara Lerman knows how to translate her vision into action. She opened her heart and her home to fulfill the mitzvah of working toward peace in our community. Yet beyond this one example, there are many others. Over the years, Barbara has provided home hospitality for countless delegations from Israel who were guests of our Federation, as well as speakers for both CRC and Partnership events. Her warm hospitality created lasting relationships between many Israelis and members of our community. As she now retires from her leadership role as chair of CRC, let us thank Barbara for her years of leadership and hard work in building a better community. Bob Feferman Former Director of Community Relations at the Jewish Federation of St. Joseph Valley Our Community | November–December 2026 | 13", "P R O G RA M R E C A P PJam Brings Family Fun to Federation This past September, families gathered inside our new PJ Library at the Jewish Federation to celebrate Sukkot. It was a joy to see so many little ones enjoying the holiday together. Thank you to everyone who joined us! Next up: our PJam Hanukkah program on December 6 at the Morris Performing Arts Center (more info on page 10) And every week, little ones and their grown-ups can play, sing and learn together at Peekaboo Hebrew playdates, 11 AM & 2 PM every Thursday! Contact Nurit LevyBeiersdorf for more info (nurit@thejewishfed.org). Top: Rabbi Herberger explains the meaning of the shofar. Bottom row: Children show off their sukkah birdie art projects. Give your children or grandchildren a little Hanukkah joy with a PJam Hanukkah Kit! Each kit is $18 and includes a puzzle, a PJ Library Hanukkah story, a coloring book, chocolate gelt, markers, and a menorah and dreidel to decorate. Puzzles come in three age levels: 0–2, 3–5, and 6–8. Please include your preferred age level when ordering. Quantities are limited for each age level, and we’ll do our best to accommodate your request, subject to availability. All proceeds go towards future PJam programming. Pickup begins December 1, 2026. Visit TheJewishFed.org/Hanukkah to order. Happy Hanukkah 14 | Our Community | November–December 2026", "J E W I S H FA M I LY S E RV I C E S Help Us Strengthen Our Caring Connections Rabbi Fred Nebel invites you to help shape the future of Jewish Family Services. Jewish Family Services (JFS), the social service arm of the Jewish Federation of St. Joseph Valley, has always embraced the motto “Caring Connections.” Recently, we distributed a questionnaire seeking your guidance on how we can improve and strengthen our services. While we have received some responses, we hope many more members of our community will take the time to participate. Your input matters. It is only through your help and feedback that we can better serve our Jewish community. So, let me ask you a simple but important question: What would you like JFS to be? Perhaps another way to approach this question is to ask: How do you define success, and how can we help you get there? Would you like to be more active, achieve financial independence, or improve your overall well-being? How do you view your home life? Is it what you always imagined it would be? When was the last time you took a step back to assess your life, consider your goals, and think about what might be missing? And how would you even begin that process? I remember speaking with a young couple with babies who were discussing the importance of a college education. I asked them why they felt college was necessary, especially given the rising cost of higher education. Their response was that they wanted their children to be able to secure good-paying jobs. I suggested that if financial success were the only measure of achievement, there might be other ways to build wealth over time, such as investing early and taking advantage of compound interest. They were appalled at the thought of their children not graduating from college. Clearly, then, their hopes for their children extended far beyond earning a paycheck. Education represented something more: opportunity, personal growth, and the fulfillment of their aspirations. For some, JFS may be the place to turn for help navigating Social Security or understanding available benefits. Others may want information about social services in the community. Some may need a loan or food cards to help ease financial pressures. Others may be struggling with mental health concerns or simply need someone who will listen. All these needs matter, and they represent just some of the ways JFS can make a difference in people’s lives. That is one of the primary reasons we conducted our survey. We want to hear from you. What are we doing well? What additional services would you like to see? Are you interested in volunteering? If so, what would volunteering look like for you? What needs are we overlooking, and how can we make our services more accessible, meaningful, and responsive to our community? Our goal is to continue building an organization that reflects the needs, hopes, and priorities of the people we serve. We cannot do that effectively without your participation. Thank you to everyone who has already taken the time to respond. If you have not yet participated, please consider this your personal invitation to join the conversation. Together, we can strengthen JFS, deepen our caring connections, and build a community where people know where to turn when they need support. So, once again, we ask: What would you like JFS to be? We look forward to hearing from you. Rabbi Fred Nebel Director of Jewish Family Services rabbi@thejewishfed.org (574) 233-1164 ext. 1806 Life is complicated, and success is rarely defined by a single goal. Our needs and aspirations are layered, personal, and constantly evolving. The same is true of an organization like JFS. Our Community | November–December 2026 | 15", "I N D I A N A J E W I S H H I STO R I C A L S O C I ETY How did the Sons of the “Patriot Rabbi” of the American Revolution end up in South Bend? Michael Brown of the Indiana Jewish Historical Society traces the remarkable Seixas family from colonial New York and Philadelphia to a grocery store, a bank and the Hebrew Society of Brotherly Love Cemetery here at home. David G. Seixas, born in 1788 to Gershom Seixas and his second wife, Hannah Judah Manuel, became a prominent innovator, manufacturer, and co-founder of the institution now known as the Pennsylvania School for the Deaf. The Seixas family originated in Portugal and Spain, with roots in Iberian Sephardic Jewry. Facing persecution as crypto-Jews, or Marranos, they sought refuge in cities such as Lisbon and London before immigrating to colonial North America in the 1730s. Although often called the “Patriot Rabbi” for his leadership during the American Revolution, Gershom Seixas was not formally ordained as a rabbi. He served as the hazzan, or cantor and religious leader, for Congregation Shearith Israel in New York. David’s paternal uncle, Moses Seixas, served as the prominent Jewish religious leader in Providence, Rhode Island. He received President George Washington’s renowned 1790 letter addressed to Moses Seixas and the Hebrew Congregation of Newport, Rhode Island, which affirmed that the federal government gives “to bigotry no sanction, to persecution no assistance.” Following a multifaceted career in Philadelphia and New York that included pioneering methods for burning anthracite coal, establishing early daguerreotype parlors, and founding the Pennsylvania School for the Deaf, David Seixas eventually withdrew from public life. In 1857, he moved to South Bend to join his younger brother, Theodore J. Seixas, who had already settled there. After arriving, he opened a grocery store and partnered with Ephraim Gerstle to expand into dry goods, remaining in the city until his death in 1864. His brother Theodore helped establish St. Joseph County Savings Bank in 1870, in collaboration with several prominent local citizens. He served as the bank’s first cashier until 1878, contributing to its early growth and securing hundreds of thousands of dollars in deposits within its first decade. 16 | Our Community | November–December 2026 A painting of David G. Seixas, circa mid-19th century Theodore’s son served in the Union Army in an Indiana artillery regiment. Records in the Shapell Roster Civil War Soldier Database document his service, along with that of several other Seixas family descendants across the nation. Several members of the Seixas family are interred in South Bend’s Historic Jewish Cemetery, known as the Hebrew Society of Brotherly Love Cemetery, which was established in 1859. Michael Brown Executive Director Indiana Jewish Historical Society michael.brown@ijhs.org", "L ETT E R F R O M T H E E D I TO R The Seixas Family in South Bend David Gershom Seixas (1788–1864): Son of Rev. Gershom Mendes Seixas. A War of 1812 veteran and pioneer in deaf education, he established the Pennsylvania Institution for the Deaf and Dumb. He later relocated to South Bend to live near his brother and died there. Theodore J. Seixas (1803–1882): Son of Rev. Gershom Mendes Seixas. He moved to South Bend in 1857 and initially operated a grocery and dry goods business. He is best known locally for co-founding and serving as the first cashier of the St. Joseph County Savings Bank in 1870, and he continued to help run the bank, which became one of the largest in Northern Indiana. Eugene E. Seixas (1844–1868): Son of Theodore J. Seixas. He served in an Indiana artillery unit in the Union Army during the Civil War. He died, along with his sister, in a drowning accident in South Bend. Adele Orah Seixas (1847–1868): Daughter of Theodore J. Seixas. She died on the same day as her brother Eugene in the 1868 drowning accident. A Fresh Look for Our Community A nod to our past, an eye toward our future: editor Steve Lotter introduces the new Our Community. I hope you’ve enjoyed the November–December 2026 issue of Our Community: better late than never, and with a fresh look! Along with a cleaner, more streamlined design, we’ve taken inspiration from the archival issue featured in last month’s newsletter and adopted a simpler name, Our Community. It’s a nod to our past with an eye toward our future. Our focus remains the same: the people who make this place, our community, so special, day in and day out. In 2027, we’ll be expanding who and what we feature, with more stories from our community organizations and synagogues that have something to share with the broader Jewish community. Have news, an event or a story we should know about? Send it my way! We’ll also be reaching out to local businesses that want to support our publication. Advertising in Our Community reaches a wide and growing Jewish audience across Michiana. Let me know if your business is interested. Thank you for reading, and for being part of the community these pages celebrate. As Hanukkah approaches, we wish you and your family a season full of light. Steve Lotter Senior Director of Development & Engagement steve@thejewishfed.org (574) 233-1164 ext. 1805 Our Community | November–December 2026 | 17", "F R O M O U R CO M M U N I TY TA B L E Muffins Even a Pumpkin Pie Skeptic Can Love Deena Abraham shares Razel Lerman’s pumpkin chocolate chip muffins, which she calls the best she’s ever had, along with a few ways to make the recipe your own. When I was little, I remember that pumpkins were mainly consumed in pies, and occasionally in cakes or cookies. They certainly were not the popular flavor that makes its way into beverages, candy, and so many other foods these days. I’m not a fan of most of the current pumpkin-flavored food items, and I have never liked pumpkin pie. It’s too pumpkiny for my taste. Before you label me as a pumpkin hater, I will clarify that I really, really like pumpkin cake and muffins. And the best pumpkin muffins I have ever had are Razel Lerman’s pumpkin muffins. They are muffin perfection. When I reached out to Razel to ask about sharing the recipe here, I learned that she has made some changes to the recipe over the years. She used to replace half of the oil with applesauce, but now uses refined coconut oil. When I make the recipe, I use sugar for half of the sweetener and either honey or maple syrup for the other half, depending on what I have on hand. Additionally, Razel sometimes bakes the batter in mini loaf pans to make pumpkin cakes. These require a longer baking time. Deena Abraham Community Contributor 18 | Our Community | November–December 2026 Pumpkin Chocolate Chip Muffins From the kitchen of Razel Lerman Ingredients • 1 c. all-purpose flour • ⅔ c. whole wheat flour • 1 c. sugar, honey, or maple syrup • 1 Tbsp. pumpkin pie spice • 1 tsp. baking soda • ¼ tsp. baking powder • ¼ tsp. salt • 2 large eggs • 1 (15 oz.) can pumpkin • ½ c. refined coconut oil • 2 c. chocolate chips Directions 1. Preheat the oven to 350°F. 2. Grease regular-sized or mini muffin tins, or use silicone muffin pans. 3. Mix both flours, the sugar (if using), pumpkin pie spice, baking soda, baking powder, and salt in a large bowl. 4. Break the eggs into a separate bowl. Add the honey or maple syrup (if using), pumpkin, and oil. Mix with a whisk until the ingredients are well blended. Stir in the chocolate chips. 5. Pour the wet mixture over the dry ingredients and fold in until the dry ingredients are moistened. Scoop the batter evenly into the muffin cups. 6. Bake regular-sized muffins for 20–25 minutes, or until they are puffed and springy to the touch. Mini muffins will need less baking time, about 17 minutes. 7. Store the muffins wrapped in a plastic bag for one to two days, or store them longer in the refrigerator or freezer.", "Jewish Federation Staff Main office: (574) 233-1164 Emily Benedix Executive Director emily@thejewishfed.org / Ext. 1802 Steve Lotter Senior Director of Development and Engagement / Editor of OCN steve@thejewishfed.org / Ext. 1805 Dan Cossman Director of Finance and Operations dan@thejewishfed.org / Ext. 1801 Monroe Lemay Emerick Director of Programming monroe@thejewishfed.org / Ext. 1811 Rabbi Fred Nebel Director of Jewish Family Services rabbi@thejewishfed.org / Ext. 1806 Nurit Levy-Beiersdorf Programming and Administrative Associate nurit@thejewishfed.org / Ext. 1820 Ben Barwick Facilities Associate ben@thejewishfed.org / Ext. 1810 Board of Directors Cristyne Porile President president@thejewishfed.org Steven Richter - President Elect Sarah Nerenberg - Vice President Sarah Feldbaum - Vice President Ben Davis - Treasurer Deena Abraham - Secretary Max Brown Phyllis DeVorkin Jean Ketcham Kevin Ludwig Brian Pappas Larry Piser Lily Shroyer Ben Silver Eli Wax Julie Wright Aviva Wulfsohn Tribute Donations In Memory of Marilyn Brown (Harriet B. Litt) In Memory of Vincent K. Roach (Shoshana & Yaakov Sloman) In Memory of Paul Klein (Minette Brown) (Phyllis DeVorkin) In Memory of Blanche Rosenberg (Ina & Irving Rosenberg) In Memory of Harriet & Bob Meyerson (Lisa Levin) In Honor of Rabbi & Mrs. Kalman (Shoshana & Yaakov Sloman) In Memory of Gilly & Alberto Nerenberg (Ilana & Michael Kirsch) In Honor of Barbara Lerman (Lorraine Davis) (Pinky Raab) In Honor of Irv Rosenberg (Lorraine Davis) Birthdays in November Stephen Alpert Beverly Arnold Joseph Bauer Scott Beisel Marsha Brook Patricia Cossman Ben Davis Daniel Ebersol Sarah Feldbaum Marjorie Fizer Jody Freid Gary Fromm Marilyn Gardner Sari Ginsparg Lexie Lightner Jo-Anne Lopatin Lynne Losecco Myrna Marcus Robert Moore Rita
